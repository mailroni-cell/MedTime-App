name: Quick web update (owner's phone)

# M-140: a push that changes ONLY page files (html / js / css in app/src/main/assets) does not build an APK.
# It publishes those files as web.zip on the "test" release; the PC watcher pushes them to the owner's phone
# in seconds (the app uses them only on top of the exact APK they were made for).
# A full APK build (and so every user) gets the changes only after the owner approves: run "Build Android APK" by hand.
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/**.html'
      - 'app/src/main/assets/**.js'
      - 'app/src/main/assets/**.css'

permissions:
  contents: write

concurrency:
  group: web-update
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300

      - name: Only page files changed?
        id: chk
        run: |
          before="${{ github.event.before }}"
          if ! git cat-file -e "$before" 2>/dev/null; then echo "only=no" >> $GITHUB_OUTPUT; exit 0; fi
          other=$(git diff --name-only "$before" "${{ github.sha }}" | grep -vE '^app/src/main/assets/.*\.(html|js|css)$' | grep -vE '\.md$' | grep -vE '^docs/' || true)  # M-379: the website (docs/) does not need an APK either
          if [ -n "$other" ]; then echo "Other files changed, the APK build handles it:"; echo "$other"; echo "only=no" >> $GITHUB_OUTPUT
          else echo "only=yes" >> $GITHUB_OUTPUT; fi

      - name: Publish web.zip on the test release
        if: steps.chk.outputs.only == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download test -p build-info.txt -O build-info.txt
          base=$(grep -oE 'run [0-9]+' build-info.txt | grep -oE '[0-9]+')
          vc=$((100 + base))
          # M-358 (owner: "the splash used to appear at once"): the app read and compared ALL 4.7 MB of page files at every start.
          # Now web.zip holds only index.html + the files changed since the commit the installed APK was built from.
          bsha=$(grep -oE '[0-9a-f]{40}' build-info.txt | head -1)
          git fetch -q --depth=300 origin main || true
          cd app/src/main/assets
          if [ -n "$bsha" ] && git cat-file -e "$bsha" 2>/dev/null; then
            files=$( (echo index.html; git diff --name-only "$bsha" "${{ github.sha }}" -- . | grep -E '\.(html|js|css)$' | sed 's#^app/src/main/assets/##') | sort -u)
          else
            files=$(ls *.html *.js *.css 2>/dev/null)
          fi
          echo "web.zip files:"; echo "$files"
          zip -q ../../../../web.zip $files
          cd ../../../..
          echo "web ${{ github.sha }} base $vc" > web-info.txt
          gh release upload test web.zip web-info.txt --clobber
          echo "::notice::Web update for APK versionCode $vc published"
