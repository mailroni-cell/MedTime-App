name: Collect usage stats
# M-238: every 3 hours, collect the app's anonymous usage messages from ntfy.sh (kept there ~12 h) into docs/stats/
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: stats
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/collect_stats.py
      - run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats
          git diff --cached --quiet || (git commit -m "stats [skip ci]" && git pull --rebase -q origin main && git push)
