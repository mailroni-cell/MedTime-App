name: Release to everyone

# M-075: copies the tested build (release "test") to release "latest",
# which every installed MedTime app checks for updates.
on:
  push:
    branches: [main]
    paths: ['release/stable.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy "test" to "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          want=$(grep -oE '^run [0-9]+' release/stable.txt | grep -oE '[0-9]+' || true)
          mkdir -p dl && cd dl
          if ! gh release download test -R "$REPO" -p MedTime-latest.apk -p build-info.txt; then
            echo "::notice::No test release yet. Nothing to release."
            exit 0
          fi
          have=$(grep -oE 'run [0-9]+' build-info.txt | grep -oE '[0-9]+')
          cur=$(gh release download latest -R "$REPO" -p build-info.txt -O - 2>/dev/null | grep -oE 'run [0-9]+' | grep -oE '[0-9]+' || echo 0)
          echo "wanted run: $want / test release: $have / users now: $cur"
          if [ -n "$want" ] && [ "$want" != "$have" ]; then
            if [ "$want" = "$cur" ]; then echo "::notice::Run $want is already released."; exit 0; fi
            echo "::error::release/stable.txt asks for run $want but the test release is run $have"; exit 1
          fi
          if [ "$have" = "$cur" ]; then echo "::notice::Run $have is already released."; exit 0; fi
          sha=$(grep -oE '[0-9a-f]{40}' build-info.txt)
          # M-181: GitHub resets the download counter when "latest" is replaced, so keep the old count first (stats/downloads.csv)
          n=$(gh api "repos/$REPO/releases/tags/latest" -q '.assets[]|select(.name=="MedTime-latest.apk")|.download_count' 2>/dev/null || echo "")
          if [ -n "$n" ] && [ "$cur" != "0" ]; then
            cd .. && mkdir -p stats && f=stats/downloads.csv
            [ -f "$f" ] || echo "date,run,downloads" > "$f"
            echo "$(date -u +%F),$cur,$n" >> "$f"
            git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$f" && git commit -m "Download count for run $cur: $n [skip ci]" && git pull --rebase -q origin main && git push || echo "::warning::could not save the download count"
            cd dl
          fi
          gh release delete latest -R "$REPO" --yes --cleanup-tag || true
          gh release create latest MedTime-latest.apk build-info.txt -R "$REPO" --target "$sha" \
            --title "MedTime (run $have)" --notes "Released to everyone: build $have"
          echo "::notice::Released run $have to everyone"

      # M-384: on 2026-10-27 "latest" (run 249) was left as a draft, so the apps' updater got 404.
      # Always make sure the release is published (also fixes it on a manual re-run).
      - name: Make sure "latest" is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit latest -R "$REPO" --draft=false --tag latest || echo "::warning::could not publish latest"
          gh release view latest -R "$REPO" --json isDraft,tagName,name

      # M-309: fast second source for the download page. The APK is split into small parts on branch "dl"
      # (raw.githubusercontent.com, a CDN that lets the page download in parallel, show progress and notice a stall).
      # The branch is replaced each time, so it holds only the current build.
      - name: Fast mirror for the download page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          [ -f dl/MedTime-latest.apk ] || { echo "::notice::No APK, no mirror."; exit 0; }
          cd dl && rm -rf parts && mkdir parts
          split -b 24m -d -a 2 MedTime-latest.apk parts/p
          size=$(stat -c%s MedTime-latest.apk); run=$(grep -oE 'run [0-9]+' build-info.txt | grep -oE '[0-9]+')
          cd parts && ls p* | jq -R . | jq -sc --argjson s "$size" --argjson r "$run" '{run:$r,size:$s,parts:.}' > manifest.json && cat manifest.json
          git init -q -b dl && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "APK mirror run $run [skip ci]"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" dl:dl
          echo "::notice::Mirror updated for run $run"
