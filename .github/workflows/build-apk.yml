name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# M-005: needed to publish the APK as the rolling "latest" release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # Show compile errors as annotations, readable without logging in
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|FAILURE|What went wrong|e: " build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedTime-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      # M-005: fixed download link for the newest APK (used by Claude to deliver it to the PC)
      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/*.apk MedTime-latest.apk
          echo "run ${{ github.run_number }} / ${{ github.sha }}" > build-info.txt
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MedTime-latest.apk build-info.txt --title "MedTime latest (run ${{ github.run_number }})" --notes "Automatic build ${{ github.run_number }}" --prerelease
