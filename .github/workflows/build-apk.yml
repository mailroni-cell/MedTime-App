name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    # M-075: a commit that only promotes a build to everyone does not build again
    paths-ignore:
      - 'release/**'
      - '.github/workflows/release-stable.yml'
      # M-140: page-only pushes go to the owner's phone as a quick web update (web-update.yml), no APK build;
      # docs-only pushes do not build either. A full build after the owner's approval: run this workflow by hand.
      - 'app/src/main/assets/**.html'
      - 'app/src/main/assets/**.js'
      - 'app/src/main/assets/**.css'
      - '**.md'
      - '.github/workflows/web-update.yml'
  workflow_dispatch:

# M-005: needed to publish the APK as the rolling "latest" release
permissions:
  contents: write

# M-123: two quick pushes built side by side and the older one finished last, so the phone got the older build.
# Now a newer push cancels the build still running, and only the newest one publishes.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # M-087: offline voice engine (sherpa-onnx, Apache-2.0). Version must match app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt
      - name: Offline voice engine libraries
        run: |
          set -e
          curl -sSfL -o so.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.20/sherpa-onnx-v1.12.20-android.tar.bz2
          tar xjf so.tar.bz2 ./jniLibs/arm64-v8a/libonnxruntime.so ./jniLibs/arm64-v8a/libsherpa-onnx-jni.so
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          rm -rf so.tar.bz2 jniLibs

      # M-091: the offline voices go inside the APK (owner's choice). Packs come from the release "voices" (workflow voices.yml)
      - name: Offline voices into the APK
        run: |
          set -e
          base=https://github.com/mailroni-cell/MedTime-App/releases/download/voices
          for p in espeak ar_kareem ro_mihai fr_upmc en_amy en_ryan; do
            curl -sSfL -o v.zip "$base/$p.zip"
            mkdir -p app/src/main/assets/piper/$p
            unzip -q -o v.zip -d app/src/main/assets/piper/$p
          done
          rm -f v.zip
          du -sh app/src/main/assets/piper

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # Show compile errors as annotations, readable without logging in
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|FAILURE|What went wrong|e: " build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedTime-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      # M-075: every build goes to the "test" release only (owner's phone, via the PC watcher).
      # The "latest" release is what all users' apps update from; it changes only when the
      # owner says "משחררים לכולם" (workflow release-stable.yml copies "test" -> "latest").
      - name: Publish rolling "test" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/*.apk MedTime-latest.apk
          echo "run ${{ github.run_number }} / ${{ github.sha }}" > build-info.txt
          gh release delete test --yes --cleanup-tag || true
          gh release create test MedTime-latest.apk build-info.txt --target "${{ github.sha }}" --title "MedTime test (run ${{ github.run_number }})" --notes "Test build ${{ github.run_number }} - owner's phone only" --prerelease
