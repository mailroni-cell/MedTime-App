name: Probe medicine pharmacies in OpenStreetMap
# M-299: one-off probe of OpenStreetMap pharmacies in Israel; result committed to data-cache/
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/probe_pharm.py || true
      - run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data-cache/pharm_probe.json && git commit -m "M-299 pharmacy probe [skip ci]" && git pull --rebase -q origin main && git push
