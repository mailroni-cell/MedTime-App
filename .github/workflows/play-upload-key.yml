name: Play - create upload key (once)

# Google Play: creates the upload key ONCE, encrypted with the owner's own password (GitHub secret UPLOAD_PASSWORD,
# typed by the owner in GitHub settings, never in chat). The encrypted key file is saved in the repo.
# It never replaces an existing key: a new key would stop store updates.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create the key
        env:
          PW: ${{ secrets.UPLOAD_PASSWORD }}
        run: |
          set -e
          if [ -z "$PW" ]; then echo "::error::Secret UPLOAD_PASSWORD is missing"; exit 1; fi
          if [ ${#PW} -lt 12 ]; then echo "::error::UPLOAD_PASSWORD must be at least 12 characters"; exit 1; fi
          if [ -f app/medtime-upload.keystore ]; then echo "::error::An upload key already exists - not replacing it"; exit 1; fi
          keytool -genkeypair -keystore app/medtime-upload.keystore -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 \
            -validity 11000 -storepass "$PW" -keypass "$PW" -dname "CN=MedTime, O=MedTime, C=IL"
          keytool -list -v -keystore app/medtime-upload.keystore -storepass "$PW" | grep -E "SHA256:" | head -1
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/medtime-upload.keystore
          git commit -m "Play: upload key (encrypted with the owner's password) [skip ci]"
          git push
