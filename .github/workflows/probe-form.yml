name: Probe Google Form
# M-229: read the owner's form (field ids) from GitHub, since Google is not reachable from Claude's container
on:
  workflow_dispatch:
    inputs:
      form:
        description: form edit id
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data-cache; exec > data-cache/form_probe.txt
          curl -sSL -o v.html -w "FINAL %{http_code} %{url_effective}\n" "https://docs.google.com/forms/d/${{ inputs.form }}/viewform"
          grep -o '<title>[^<]*' v.html || true
          grep -o 'FB_PUBLIC_LOAD_DATA_ = .*' v.html | head -c 4000 || true
          grep -o 'action="[^"]*formResponse"' v.html || true
      - run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data-cache/form_probe.txt && git commit -m "M-229 form probe [skip ci]" && git pull --rebase -q origin main && git push
