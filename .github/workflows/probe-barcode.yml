name: Probe medicine barcode lookup
# M-285: one-off probe: can the registry find a medicine by its box barcode; result committed to data-cache/
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/probe_barcode.py || true
      - run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data-cache/barcode_probe.json && git commit -m "M-285 barcode probe [skip ci]" && git pull --rebase -q origin main && git push
