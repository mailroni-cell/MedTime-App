name: Calm videos (release media)

# M-367 (app diet): calm-mode videos that are not inside the APK live on the release "media".
# The app plays them from there the first time and keeps a copy on the phone. Runs when media/video changes.
on:
  push:
    branches: [main]
    paths: ['media/video/**', 'media/calm/**', 'media/ambient/**', '.github/workflows/media.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release "media"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view media >/dev/null 2>&1 || gh release create media --target "${{ github.sha }}" --title "MedTime calm videos" --notes "Calm-mode videos, downloaded by the app when first chosen" --prerelease
          # M-368: recorded calm voices, one zip per language (Hebrew is inside the APK)
          mkdir -p out
          for d in media/calm/*/; do l=$(basename "$d"); (cd "$d" && zip -q -r -9 "../../../out/calm_$l.zip" .); done
          # M-369: the offline voice engine (sherpa-onnx v1.12.20, must match Tts.kt), downloaded by the app with the first voice
          curl -sSfL -o so.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.20/sherpa-onnx-v1.12.20-android.tar.bz2
          tar xjf so.tar.bz2 ./jniLibs/arm64-v8a/libonnxruntime.so ./jniLibs/arm64-v8a/libsherpa-onnx-jni.so
          (cd jniLibs/arm64-v8a && zip -q -9 ../../out/engine_arm64.zip libonnxruntime.so libsherpa-onnx-jni.so)
          rm -rf so.tar.bz2 jniLibs
          # M-369: nature sounds that are not inside the APK
          cp media/ambient/*.ogg out/
          gh release upload media media/video/*.mp4 out/*.zip out/*.ogg --clobber
          gh release view media --json assets --jq '.assets[] | "\(.name) \(.size)"'
