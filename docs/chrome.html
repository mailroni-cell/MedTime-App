<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>פותח ב-Chrome…</title>
<!-- M-330 (owner): links sent from the Claude app open in an in-app tab, and the app refuses intent:// links. This page bounces to Chrome:
     https://medtime.pages.dev/chrome.html#/stats.html opens https://medtime.pages.dev/stats.html in Chrome (a full https URL after # also works). -->
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0f172a;color:#e2e8f0;font:600 1.1rem system-ui}
a{display:block;padding:18px 28px;border-radius:18px;background:#22c55e;color:#04210f;font-weight:800;font-size:1.25rem;text-decoration:none}</style></head>
<body><div>פותח ב-Chrome…</div><a id="go" href="#">🌐 פתיחה ב-Chrome</a><div style="color:#94a3b8;font-size:.95rem">אם לא נפתח לבד, לוחצים על הכפתור</div>
<script>
  let t = decodeURIComponent(location.hash.slice(1) || '/stats.html');
  if (!/^https:\/\//.test(t)) t = 'https://medtime.pages.dev' + (t[0] === '/' ? '' : '/') + t;
  const u = new URL(t), intent = 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(t) + ';end';
  const go = document.getElementById('go'); go.href = /Android/.test(navigator.userAgent) ? intent : t;
  setTimeout(() => { location.href = go.href; }, 300);
</script></body></html>
