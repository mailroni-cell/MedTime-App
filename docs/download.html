<style>
  :root { --bg: #0b1024; --card: #131a3a; --tx: #f1f5f9; --mut: #a5b4fc; --ok: #22c55e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(circle at 50% 0, #1e3a8a, var(--bg) 60%); color: var(--tx); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; min-height: 100vh; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
  .langs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 18px; }
  .langs button { border: 1px solid #334155; background: transparent; color: var(--mut); border-radius: 999px; padding: 6px 12px; font-size: .95rem; }

  .sub { text-align: center; color: var(--mut); margin: 0 0 22px; font-size: 1.05rem; }
  .dl { display: block; text-align: center; text-decoration: none; color: #fff; font-weight: 800; font-size: 1.35rem; padding: 18px 16px; border-radius: 18px;
        background: linear-gradient(135deg, #22c55e, #15803d); box-shadow: 0 6px 0 #14532d, 0 12px 28px rgba(34,197,94,.35); }
  .dl.go { background: linear-gradient(90deg, #22c55e var(--p, 0%), #166534 var(--p, 0%)); font-size: 1.2rem; }

  ol { background: var(--card); border-radius: 18px; padding: 16px 18px; padding-inline-start: 40px; margin: 0 0 16px; line-height: 1.55; font-size: 1.08rem; }
  ol li { margin-bottom: 8px; }
  .note { background: rgba(250,204,21,.1); border: 1px solid rgba(250,204,21,.4); border-radius: 14px; padding: 12px 14px; color: #fde68a; font-size: .98rem; line-height: 1.5; }
  /* M-308: friendly install guide with tiny animated phones */
  .inapp { display: none; text-align: center; text-decoration: none; color: #fff; font-weight: 800; font-size: 1.1rem; padding: 14px; border-radius: 16px; margin: 0 0 16px;
           background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 5px 0 #78350f; }
  .hint { text-align: center; color: var(--mut); font-size: .92rem; margin: -12px 0 20px; }
  .trust { display: flex; gap: 12px; align-items: center; background: linear-gradient(135deg, rgba(34,197,94,.16), rgba(56,189,248,.12)); border: 1px solid rgba(74,222,128,.35); border-radius: 18px; padding: 14px; margin: 0 0 16px; line-height: 1.5; }
  .trust .sh { font-size: 2.3rem; animation: bob 3s ease-in-out infinite; }
  .trust b { display: block; font-size: 1.08rem; margin-bottom: 2px; }
  .trust span { color: #cbd5e1; font-size: .98rem; }
  .step { display: flex; gap: 14px; align-items: center; background: var(--card); border-radius: 18px; padding: 12px 14px; margin-bottom: 12px; }
  .step .n { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: #334155; display: grid; place-items: center; font-weight: 800; }
  .step .tx { flex: 1; line-height: 1.45; }
  .step .tx b { display: block; font-size: 1.12rem; }
  .step .tx span { color: #cbd5e1; font-size: .98rem; }
  .ph { flex: 0 0 auto; width: 58px; height: 96px; border-radius: 12px; border: 3px solid #475569; background: #0f172a; position: relative; overflow: hidden; display: grid; place-items: center; }
  .ph::before { content: ''; position: absolute; top: 4px; width: 16px; height: 3px; border-radius: 2px; background: #475569; }
  .bar { position: absolute; bottom: 18px; left: 9px; right: 9px; height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); animation: fill 2.6s ease-in-out infinite; }
  .tg { width: 34px; height: 19px; border-radius: 10px; background: #475569; position: relative; animation: tgbg 2.6s infinite; }
  .tg::after { content: ''; position: absolute; top: 2px; inset-inline-start: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; animation: tgk 2.6s infinite; }
  .ok { width: 34px; height: 34px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; font-weight: 900; color: #fff; animation: pop 2.6s infinite; }
  .sam { background: rgba(56,189,248,.1); border: 1px solid rgba(56,189,248,.35); border-radius: 14px; padding: 10px 14px; color: #bae6fd; font-size: .95rem; line-height: 1.5; margin-bottom: 14px; }
  @keyframes fill { 0% { width: 0 } 70%, 100% { width: 100% } }
  @keyframes tgbg { 0%, 35% { background: #475569 } 50%, 100% { background: var(--ok) } }
  @keyframes tgk { 0%, 35% { transform: none } 50%, 100% { transform: translateX(15px) } }
  [dir=rtl] .tg::after { animation-name: tgkr; }
  @keyframes tgkr { 0%, 35% { transform: none } 50%, 100% { transform: translateX(-15px) } }
  @keyframes pop { 0%, 30% { transform: scale(.3); opacity: 0 } 45% { transform: scale(1.15); opacity: 1 } 55%, 100% { transform: scale(1) } }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-4deg) } }
  .ver { text-align: center; color: #64748b; font-size: .85rem; margin-top: 18px; }

<body>

<script>

  const T = {
    sub: ['תזכורות תרופות פשוטות וברורות', 'تذكيرات أدوية بسيطة وواضحة', 'Mementouri simple pentru medicamente', 'Rappels de médicaments simples et clairs', 'Simple, clear medicine reminders', 'Простые и понятные напоминания о лекарствах'],
    dl: ['⬇️ הורדת האפליקציה', '⬇️ تنزيل التطبيق', '⬇️ Descarcă aplicația', '⬇️ Télécharger l’application', '⬇️ Download the app', '⬇️ Скачать приложение'],

    prep: ['⏳ מתחילים…', '⏳ نبدأ…', '⏳ Pornim…', '⏳ On commence…', '⏳ Starting…', '⏳ Начинаем…'],

    done: ['✅ ירד! פותחים מההודעה למטה', '✅ تم! افتحه من الإشعار بالأسفل', '✅ Gata! Deschide din notificarea de jos', '✅ C’est fait ! Ouvrez depuis la notification', '✅ Done! Open it from the notification below', '✅ Готово! Откройте из уведомления внизу'],
    alt: ['🔁 עוברים למקור חלופי…', '🔁 ننتقل إلى مصدر بديل…', '🔁 Trecem la o sursă alternativă…', '🔁 Passage à une source alternative…', '🔁 Switching to a backup source…', '🔁 Переключаемся на запасной источник…'],
    inapp: ['🌐 פתחו את הדף ב-Chrome כדי להוריד', '🌐 افتح الصفحة في Chrome للتنزيل', '🌐 Deschide pagina în Chrome pentru descărcare', '🌐 Ouvrez la page dans Chrome pour télécharger', '🌐 Open this page in Chrome to download', '🌐 Откройте страницу в Chrome для загрузки'],
    hint: ['כדאי לפתוח את הדף ב-Chrome 🙂', 'يُفضّل فتح الصفحة في Chrome 🙂', 'Cel mai bine deschide pagina în Chrome 🙂', 'Ouvrez de préférence la page dans Chrome 🙂', 'Best opened in Chrome 🙂', 'Лучше открыть страницу в Chrome 🙂'],
    trT: ['הטלפון ישאל אם מותר, וזה בסדר גמור', 'سيسأل الهاتف إن كان مسموحًا، وهذا طبيعي تمامًا', 'Telefonul va întreba dacă are voie, e perfect normal', 'Le téléphone demandera la permission, c’est tout à fait normal', 'Your phone will ask first, and that is perfectly fine', 'Телефон спросит разрешения, и это нормально'],
    trS: ['האפליקציה מגיעה ישירות מאיתנו ולא דרך חנות, אז הטלפון פשוט מוודא איתך. MedTime לא אוסף שום מידע, הכול נשמר רק אצלך.', 'التطبيق يصلك منّا مباشرة وليس من متجر، فالهاتف يتأكد منك فقط. MedTime لا يجمع أي معلومات، وكل شيء يبقى عندك.', 'Aplicația vine direct de la noi, nu dintr-un magazin, așa că telefonul doar verifică cu tine. MedTime nu colectează date, totul rămâne la tine.', 'L’application vient directement de nous et non d’un store, le téléphone vérifie donc avec vous. MedTime ne collecte aucune donnée, tout reste chez vous.', 'The app comes straight from us, not from a store, so the phone just checks with you. MedTime collects no data; everything stays on your phone.', 'Приложение приходит напрямую от нас, а не из магазина, поэтому телефон просто уточняет у вас. MedTime не собирает данные, всё остаётся у вас.'],
    steps: [
      [['מורידים', 'ההורדה מתחילה לבד (אם לא, לוחצים על הכפתור הירוק). מחכים רגע עד הסוף.'], ['מאשרים פעם אחת', 'אם הטלפון שואל: "הגדרות" ← מדליקים "לאפשר מהמקור הזה" ← חוזרים.'], ['מתקינים וזהו!', 'לוחצים "התקנה". אם מופיע Play Protect: "פרטים נוספים" ← "להתקין בכל זאת".']],
      [['التنزيل', 'يبدأ التنزيل تلقائيًا (وإن لم يبدأ اضغط الزر الأخضر). انتظر قليلًا حتى ينتهي.'], ['موافقة مرة واحدة', 'إذا سأل الهاتف: "الإعدادات" ← فعّل "السماح من هذا المصدر" ← ارجع.'], ['التثبيت وانتهينا!', 'اضغط "تثبيت". إذا ظهر Play Protect: "مزيد من التفاصيل" ← "التثبيت على أي حال".']],
      [['Descarci', 'Descărcarea pornește singură (dacă nu, apasă butonul verde). Așteaptă puțin până se termină.'], ['Aprobi o singură dată', 'Dacă telefonul întreabă: „Setări” → activează „Permite din această sursă” → înapoi.'], ['Instalezi și gata!', 'Apasă „Instalează”. Dacă apare Play Protect: „Mai multe detalii” → „Instalează oricum”.']],
      [['Téléchargez', 'Le téléchargement démarre tout seul (sinon, appuyez sur le bouton vert). Patientez un instant.'], ['Autorisez une seule fois', 'Si le téléphone demande : « Paramètres » → activez « Autoriser depuis cette source » → retour.'], ['Installez, c’est tout !', 'Appuyez sur « Installer ». Si Play Protect apparaît : « Plus de détails » → « Installer quand même ».']],
      [['Download', 'The download starts by itself (if not, tap the green button). Wait a moment.'], ['Allow it once', 'If the phone asks: "Settings" → turn on "Allow from this source" → go back.'], ['Install, done!', 'Tap "Install". If Play Protect appears: "More details" → "Install anyway".']],
      [['Скачайте', 'Загрузка начнётся сама (если нет, нажмите зелёную кнопку). Немного подождите.'], ['Разрешите один раз', 'Если телефон спросит: «Настройки» → включите «Разрешить из этого источника» → назад.'], ['Установите, и всё!', 'Нажмите «Установить». Если появится Play Protect: «Подробнее» → «Всё равно установить».']]
    ],
    sam: ['📱 בסמסונג, אם כתוב שההתקנה נחסמה: הגדרות ← אבטחה ופרטיות ← ‏"חוסם אוטומטי" ‏(Auto Blocker)‏ ← כיבוי. אחרי ההתקנה אפשר להדליק שוב.', '📱 في سامسونج، إذا ظهر أن التثبيت محظور: الإعدادات ← الأمان والخصوصية ← Auto Blocker ← إيقاف. بعد التثبيت يمكن تشغيله مجددًا.', '📱 Pe Samsung, dacă instalarea e blocată: Setări → Securitate și confidențialitate → Auto Blocker → oprit. După instalare îl poți porni din nou.', '📱 Sur Samsung, si l’installation est bloquée : Paramètres → Sécurité et confidentialité → Auto Blocker → désactiver. Vous pouvez le réactiver après.', '📱 On Samsung, if the install is blocked: Settings → Security and privacy → Auto Blocker → off. You can turn it back on afterwards.', '📱 На Samsung, если установка заблокирована: Настройки → Безопасность и конфиденциальность → Auto Blocker → выкл. После установки можно включить снова.']
  };
  let LI = 0;
  function set(l) {
    const i = Math.max(0, L.indexOf(l));
    LI = i; document.documentElement.lang = L[i]; document.documentElement.dir = i < 2 ? 'rtl' : 'ltr';
    document.getElementById('sub').textContent = T.sub[i];
    if (!busy) document.getElementById('dl').textContent = T.dl[i];
    document.getElementById('dl2').textContent = T.dl2[i];
    ['inapp', 'hint', 'trT', 'trS', 'sam'].forEach(k => document.getElementById(k).textContent = T[k][i]);
    const PH = ['<div class="bar"><i></i></div><span style="font-size:1.5rem">📥</span>', '<div class="tg"></div>', '<div class="ok">✓</div>'];
    const box = document.getElementById('steps'); box.innerHTML = '';
    T.steps[i].forEach((st, k) => { const d = document.createElement('div'); d.className = 'step';
      d.innerHTML = '<div class="n">' + (k + 1) + '</div><div class="tx"><b></b><span></span></div><div class="ph">' + PH[k] + '</div>';
      d.querySelector('b').textContent = st[0]; d.querySelector('span').textContent = st[1]; box.appendChild(d); });
    document.querySelectorAll('#langs button').forEach((b, k) => b.classList.toggle('on', k === i));
  }
  // M-309: the green button downloads from a fast mirror in parts, 4 at a time, with a progress bar.
  // A part that gets no data for 12 s is retried; if the mirror fails, the button switches to GitHub by itself.
  // M-315: anonymous counts for the stats page (no id, no personal data): a page visit and each download with its source
  const ping = (kind, src) => { const b = JSON.stringify({ kind: kind, src: src || '', lang: L[LI] });
    ['https://ntfy.sh/medtime-v3tqzebpancz9djidfg7bh', 'https://medtime.pages.dev/api/hit'].forEach(u => { try { fetch(u, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: b }).catch(() => { }); } catch (e) { } }); };  // M-327: also our Cloudflare counter
  const OWN = 'mailroni-cell/MedTime-App', RAW = 'https://raw.githubusercontent.com/' + OWN + '/';
  const btn = document.getElementById('dl'), REL = btn.href;
  let busy = false, file = null;
  function part(url, on) {
    return new Promise((res, rej) => {
      const ac = new AbortController(); let t, n = 0; const chunks = [];
      const kick = () => { clearTimeout(t); t = setTimeout(() => ac.abort(), 12000); };
      kick();
      fetch(url, { signal: ac.signal, cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error(r.status);
        const rd = r.body.getReader();
        const pump = () => rd.read().then(({ done, value }) => {
          if (done) { clearTimeout(t); return res(new Blob(chunks)); }
          chunks.push(value); n += value.length; on(n); kick(); return pump();
        });
        return pump();
      }).catch(e => { clearTimeout(t); rej(e); });
    });
  }
  async function fast() {
    let ref = 'dl';
    try { const j = await (await fetch('https://api.github.com/repos/' + OWN + '/branches/dl')).json(); if (j.commit) ref = j.commit.sha; } catch (e) { }
    const m = await (await fetch(RAW + ref + '/manifest.json', { cache: 'no-store' })).json();
    const got = m.parts.map(() => 0), out = [];
    const t0 = Date.now();
    const show = () => { const p = Math.min(99, Math.floor(got.reduce((a, b) => a + b, 0) * 100 / m.size));
      btn.style.setProperty('--p', p + '%'); btn.textContent = T.prog[LI] + p + '%'; };
    let next = 0;
    const worker = async () => { while (next < m.parts.length) { const i = next++;
      for (let a = 0; ; a++) { try { out[i] = await part(RAW + ref + '/' + m.parts[i], n => { got[i] = n; show(); }); break; }
        catch (e) { got[i] = 0; if (a >= 2) throw e; } } } };
    await Promise.all([0, 1, 2, 3].map(worker));
    const b = new Blob(out, { type: 'application/vnd.android.package-archive' });
    if (b.size !== m.size) throw new Error('size');
    return b;
  }
  function save() { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = 'MedTime.apk'; document.body.appendChild(a); a.click(); a.remove(); }
  btn.addEventListener('click', e => {
    if (!window.fetch || !window.ReadableStream) { ping('dl', 'gh'); return; }  // old browser: plain GitHub download
    e.preventDefault();
    if (file) return save();
    if (busy) return;
    busy = true; btn.classList.add('go'); btn.textContent = T.prep[LI];
    fast().then(b => { file = b; save(); ping('dl', 'fast'); btn.style.setProperty('--p', '100%'); btn.textContent = T.done[LI]; busy = false; })
      .catch(() => { btn.classList.remove('go'); btn.textContent = T.alt[LI]; ping('dl', 'gh'); setTimeout(() => { busy = false; location.href = REL; }, 900); });
  });
  // M-314: links opened inside Facebook / Instagram / other in-app browsers often cannot download files: offer Chrome first
  if (/FBAN|FBAV|FB_IAB|Instagram|Line\/|TikTok|musical_ly|; wv\)/.test(navigator.userAgent) && /Android/.test(navigator.userAgent)) document.getElementById('inapp').style.display = 'block';
  document.getElementById('dl2').addEventListener('click', () => ping('dl', 'drive'));
  // M-326 (Roni): on Android the download starts by itself when the page opens (once per visit; not in in-app browsers, which can't save files)
  const inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|TikTok|musical_ly|; wv\)/.test(navigator.userAgent);
  try { if (/Android/.test(navigator.userAgent) && !inApp && !sessionStorage.getItem('mt_auto')) { sessionStorage.setItem('mt_auto', '1'); setTimeout(() => btn.click(), 1200); } } catch (e) { }
  try { if (!sessionStorage.getItem('mt_v')) { sessionStorage.setItem('mt_v', '1'); setTimeout(() => ping('visit'), 300); } } catch (e) { ping('visit'); }
  const box = document.getElementById('langs');
  L.forEach((l, k) => { const b = document.createElement('button'); b.textContent = NAMES[k]; b.onclick = () => set(l); box.appendChild(b); });
  const q = new URLSearchParams(location.search).get('lang');
  const nav = (navigator.language || 'he').slice(0, 2).replace('iw', 'he');
  // M-328 (owner): Israeli audience: Hebrew unless the link asks (?lang=) or the phone is set to Arabic, Romanian, French or Russian (English phones get Hebrew)
  set(L.includes(q) ? q : (L.includes(nav) && nav !== 'en') ? nav : 'he');
  fetch('https://api.github.com/repos/mailroni-cell/MedTime-App/releases/tags/latest').then(r => r.json()).then(j => {
    const a = (j.assets || []).find(x => /\.apk$/.test(x.name)); if (!a) return;
    document.getElementById('ver').textContent = (j.name || '') + ' · ' + Math.round(a.size / 1048576) + 'MB · ' + (a.updated_at || '').slice(0, 10);
  }).catch(() => { });
</script>
