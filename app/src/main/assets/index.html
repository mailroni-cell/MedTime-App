<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedTime</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 480px;
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.6rem;
            color: #38bdf8;
        }

        #canvas-container {
            width: 100%;
            max-width: 480px;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-add:active {
            background: var(--primary-hover);
        }

        .med-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 480px;
        }

        .med-item {
            background: var(--card);
            padding: 14px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid var(--primary);
        }

        .med-info h3 {
            font-size: 1.05rem;
            margin-bottom: 2px;
        }

        .med-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* M-005: reminder status + test button */
        .status-box {
            width: 100%;
            max-width: 480px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-line {
            background: #422006;
            border: 1px solid #f59e0b;
            color: #fde68a;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .status-line.ok {
            background: #052e1c;
            border-color: var(--accent);
            color: #a7f3d0;
        }

        .status-line button, button.btn-test {
            background: transparent;
            border: 1px solid currentColor;
            color: inherit;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        button.btn-test {
            color: #38bdf8;
            padding: 10px;
            font-size: 0.95rem;
        }

        /* M-006 / M-010: one card per medicine, large and readable */
        .item-row {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: #38bdf8;
        }

        .field-label {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .item-row input {
            font-size: 1.15rem;
            padding: 14px 12px;
        }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .type-btn {
            background: #1e293b;
            border: 2px solid #334155;
            color: var(--text);
            border-radius: 10px;
            padding: 8px 4px;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .type-btn .ico {
            font-size: 1.6rem;
        }

        .type-btn.sel {
            border-color: #38bdf8;
            background: #0c4a6e;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        /* M-010: time button + scroll wheel picker */
        .time-btn {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            border-radius: 10px;
            padding: 14px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            direction: ltr;
        }

        .sheet-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 50;
        }

        .sheet-bg.open {
            display: flex;
        }

        .sheet {
            background: var(--card);
            width: 100%;
            max-width: 480px;
            border-radius: 18px 18px 0 0;
            padding: 16px 16px 24px;
        }

        .sheet h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .wheels {
            direction: ltr;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .wheel-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .wheel-col small {
            color: var(--text-muted);
        }

        .wheel {
            height: 220px;
            width: 96px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            position: relative;
            -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
            mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
        }

        .wheel::-webkit-scrollbar {
            display: none;
        }

        .wheel div {
            height: 44px;
            line-height: 44px;
            text-align: center;
            font-size: 1.5rem;
            color: var(--text-muted);
            scroll-snap-align: center;
        }

        .wheel div.on {
            color: #f8fafc;
            font-size: 2rem;
            font-weight: 700;
        }

        .wheel-sep {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 20px;
        }

        .wheel-band {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(50% + 10px);
            height: 46px;
            transform: translateY(-50%);
            border-top: 2px solid #38bdf8;
            border-bottom: 2px solid #38bdf8;
            pointer-events: none;
            border-radius: 6px;
        }

        .sheet-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .sheet-actions button {
            padding: 14px;
            border-radius: 10px;
            font-size: 1.05rem;
            border: none;
        }

        select {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .item-row .btn-remove-item {
            background: transparent;
            border: 1px solid #475569;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 1rem;
        }

        button.btn-add-item {
            background: transparent;
            border: 1px dashed #38bdf8;
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .med-info ul {
            list-style: none;
            margin-top: 4px;
        }

        .med-info li {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* M-007: voice options */
        .voice-card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.95rem;
        }

        .switch-row input {
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
        }

        .switch-row.disabled {
            opacity: 0.4;
        }

        /* M-009: language picker */
        header {
            position: relative;
        }

        .lang-select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
        }

        /* M-011: gear button + settings screen */
        .gear-btn {
            position: absolute;
            top: 0;
            inset-inline-start: 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            padding: 2px 6px;
        }

        .gear-btn .badge {
            position: absolute;
            top: 2px;
            inset-inline-end: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f59e0b;
            display: none;
        }

        .gear-btn.warn .badge {
            display: block;
        }

        .settings-page {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 40;
            overflow-y: auto;
            padding: 16px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .settings-page.open {
            display: flex;
        }

        .settings-head {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .settings-head h2 {
            color: #38bdf8;
        }

        .settings-head button {
            background: #334155;
            color: var(--text);
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 1rem;
        }

        .settings-page .card h3 {
            font-size: 1.05rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .sound-group {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 10px 0 4px;
        }

        .sound-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }

        .sound-row label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sound-row input {
            width: 20px;
            height: 20px;
            accent-color: #38bdf8;
        }

        .sound-row button {
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            border-radius: 6px;
            padding: 4px 10px;
            white-space: nowrap;
        }

        .sound-list {
            max-height: 320px;
            overflow-y: auto;
        }

        .main-warn {
            width: 100%;
            max-width: 480px;
            margin-bottom: 16px;
        }

        /* M-011: low-vision display: bigger text, yellow on black */
        html.lowvision {
            font-size: 20px;
        }

        html.lowvision body,
        html.lowvision .settings-page {
            --bg: #000000;
            --card: #000000;
            --text: #ffffff;
            --text-muted: #ffe500;
            background: #000000;
        }

        html.lowvision .card,
        html.lowvision .med-item,
        html.lowvision .item-row {
            border: 2px solid #ffe500;
        }

        html.lowvision input,
        html.lowvision select,
        html.lowvision .time-btn {
            background: #000000;
            border: 2px solid #ffffff;
            color: #ffffff;
        }

        html.lowvision .med-info h3,
        html.lowvision .med-info li {
            color: #ffe500;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>MedTime</h1>
        <button type="button" id="gear-btn" class="gear-btn" onclick="openSettingsPage()" aria-label="Settings">⚙️<span class="badge"></span></button>
    </header>

    <div id="main-warn" class="main-warn"></div>

    <div id="canvas-container"></div>

    <div class="card">
        <form id="med-form" class="form-group">
            <div id="item-rows" class="form-group"></div>
            <button type="button" class="btn-add-item" onclick="addItemRow()" data-i18n="addMore"></button>
            <div class="field-label" data-i18n="timeLabel"></div>
            <input type="hidden" id="med-time">
            <button type="button" id="time-btn" class="time-btn" onclick="openTimePicker()">--:--</button>
            <button type="submit" class="btn-add" data-i18n="addReminder"></button>
        </form>
    </div>

    <ul id="med-list" class="med-list"></ul>

    <!-- M-011: settings screen (gear button) -->
    <div id="settings-page" class="settings-page">
        <div class="settings-head">
            <h2>⚙️ <span data-i18n="settings"></span></h2>
            <button type="button" onclick="closeSettingsPage()">✕ <span data-i18n="close"></span></button>
        </div>

        <div class="card">
            <h3 data-i18n="langTitle"></h3>
            <select id="lang-select" class="lang-select" aria-label="Language">
                <option value="he">עברית</option>
                <option value="ar">العربية</option>
                <option value="ro">Română</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
        </div>

        <div class="card voice-card">
            <h3 data-i18n="voiceTitle"></h3>
            <label class="switch-row"><span data-i18n="voiceOn"></span><input type="checkbox" id="v-on"></label>
            <label class="switch-row" id="row-names"><span data-i18n="voiceNames"></span><input type="checkbox" id="v-names"></label>
            <label class="switch-row" id="row-dose"><span data-i18n="voiceDose"></span><input type="checkbox" id="v-dose"></label>
        </div>

        <div class="card">
            <h3 data-i18n="soundTitle"></h3>
            <div id="sound-list" class="sound-list"></div>
        </div>

        <div class="card">
            <h3 data-i18n="lowVisionTitle"></h3>
            <label class="switch-row"><span data-i18n="lowVisionOn"></span><input type="checkbox" id="low-vision"></label>
        </div>

        <div class="card">
            <h3 data-i18n="statusTitle"></h3>
            <div id="status-box" class="status-box"></div>
        </div>
    </div>

    <!-- M-010: scroll wheel time picker -->
    <div id="time-sheet" class="sheet-bg" onclick="if (event.target === this) closeTimePicker()">
        <div class="sheet">
            <h3 data-i18n="timeLabel"></h3>
            <div class="wheels">
                <div class="wheel-col"><small data-i18n="hours"></small><div id="wheel-h" class="wheel"></div></div>
                <div class="wheel-sep">:</div>
                <div class="wheel-col"><small data-i18n="minutes"></small><div id="wheel-m" class="wheel"></div></div>
                <div class="wheel-band"></div>
            </div>
            <div class="sheet-actions">
                <button type="button" style="background:#334155;color:#f8fafc" onclick="closeTimePicker()" data-i18n="cancel"></button>
                <button type="button" style="background:var(--primary);color:#fff" onclick="confirmTimePicker()" data-i18n="ok"></button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const pillGroup = new THREE.Group();
        const cylinderGeo = new THREE.CylinderGeometry(0.7, 0.7, 1.2, 32);
        const sphereGeo = new THREE.SphereGeometry(0.7, 32, 16);

        const matRed = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, metalness: 0.1 });
        const matWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3, metalness: 0.1 });

        const bodyMesh = new THREE.Mesh(cylinderGeo, matWhite);
        const capTop = new THREE.Mesh(sphereGeo, matRed);
        capTop.position.y = 0.6;
        const capBottom = new THREE.Mesh(sphereGeo, matWhite);
        capBottom.position.y = -0.6;

        pillGroup.add(bodyMesh, capTop, capBottom);
        pillGroup.rotation.z = Math.PI / 4;
        scene.add(pillGroup);

        camera.position.z = 4.5;

        function animate() {
            requestAnimationFrame(animate);
            pillGroup.rotation.y += 0.015;
            pillGroup.rotation.x += 0.008;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.error(e);
            }
        }

        const form = document.getElementById('med-form');
        const list = document.getElementById('med-list');

        // M-005: native Android bridge (exists only inside the app, not in a browser)
        const Native = window.MedTimeNative || null;

        function loadMeds() {
            const data = localStorage.getItem('medtime_list');
            let meds = [];
            try { meds = data ? JSON.parse(data) : []; } catch (e) { meds = []; }
            // Older entries: give them an id, and turn a single name/dose into an items list
            let changed = false;
            meds.forEach((m, i) => {
                if (!m.id) { m.id = newId() + i; changed = true; }
                if (!Array.isArray(m.items)) {
                    m.items = [{ name: m.name || '', dose: m.dose || '', type: 'pill' }];
                    delete m.name; delete m.dose;
                    changed = true;
                }
            });
            if (changed) localStorage.setItem('medtime_list', JSON.stringify(meds));
            return meds;
        }

        function newId() {
            // 1..99,999,999 (fits the Android alarm request code)
            return (Date.now() % 99000000) + 1;
        }

        function syncNative(meds) {
            if (!Native) return;
            try {
                Native.syncReminders(JSON.stringify(meds.map(m => ({
                    id: m.id, time: m.time, items: m.items
                }))));
            } catch (e) { console.error(e); }
        }

        function saveMeds(meds) {
            localStorage.setItem('medtime_list', JSON.stringify(meds));
            syncNative(meds);
            renderMeds();
        }

        // M-009: all texts in 5 languages
        const I18N = {
         "he": {
          "settings": "הגדרות",
          "close": "סגור",
          "langTitle": "🌐 שפה",
          "soundTitle": "🔔 צליל התזכורת",
          "soundDefault": "צליל השעון המעורר של הטלפון",
          "soundNone": "בלי צליל (רק רטט והקראה)",
          "soundAlarm": "צלילי שעון מעורר",
          "soundNotif": "צלילי התראה",
          "preview": "▶ נסה",
          "lowVisionTitle": "👓 תצוגה לכבדי ראייה",
          "lowVisionOn": "טקסט גדול וניגודיות גבוהה",
          "statusTitle": "✅ מצב התזכורות",
          "problemMain": "⚠️ יש הגדרה שעלולה לעכב תזכורות",
          "openSettings": "להגדרות",
          "item": "פריט",
          "typeLabel": "סוג",
          "nameLabel": "שם התרופה",
          "namePh": "למשל: אקמול",
          "doseLabel": "מינון",
          "dosePh": "למשל: 1 כדור, 10 יחידות",
          "timeLabel": "שעת התזכורת",
          "ok": "אישור",
          "cancel": "ביטול",
          "hours": "שעה",
          "minutes": "דקות",
          "addMore": "➕ עוד תרופה / זריקה לאותה שעה",
          "addReminder": "הוסף תזכורת",
          "voiceTitle": "🔊 הקראה קולית בתזכורת",
          "voiceOn": "להקריא בקול",
          "voiceNames": "להגיד אילו תרופות",
          "voiceDose": "להגיד גם את המינון",
          "st_notifications": "ההתראות של האפליקציה כבויות",
          "st_exact": "אין הרשאה לשעון מעורר מדויק",
          "st_fullScreen": "אין הרשאה למסך תזכורת מלא",

        const RTL_LANGS = ['he', 'ar'];
        let LANG = 'he';
        try { LANG = localStorage.getItem('medtime_lang') || 'he'; } catch (e) { }
        if (!I18N[LANG]) LANG = 'he';

        function t(key) {
            return (I18N[LANG] && I18N[LANG][key]) || I18N.he[key] || key;
        }

        function applyLanguage() {
            document.documentElement.lang = LANG;
            document.documentElement.dir = RTL_LANGS.includes(LANG) ? 'rtl' : 'ltr';
            document.getElementById('lang-select').value = LANG;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
            if (Native && Native.setLanguage) {
                try { Native.setLanguage(LANG); } catch (e) { }
            }
        }

        function renderStatus() {
            const box = document.getElementById('status-box');
            if (!Native) { box.innerHTML = ''; return; }
            let st = {};
            try { st = JSON.parse(Native.getStatus()); } catch (e) { }
            let html = '';
            ['notifications', 'exact', 'fullScreen', 'battery'].forEach(k => {
                if (st[k] === false) {
                    html += `<div class="status-line"><span>⚠️ ${t('st_' + k)}</span>` +
                        `<button onclick="MedTimeNative.openSettings('${k}')">${t('fix')}</button></div>`;
                }
            });
            if (st.tts === 'no_voice' || st.tts === 'no_hebrew') {
                html += `<div class="status-line"><span>⚠️ ${t('noVoice')}</span>` +
                    `<button onclick="MedTimeNative.openSettings('tts')">${t('voiceSettings')}</button></div>`;
            }
            const problem = !!html;
            // Main screen: only a short line when something needs fixing; details live in settings
            document.getElementById('main-warn').innerHTML = problem
                ? `<div class="status-line"><span>${t('problemMain')}</span><button onclick="openSettingsPage()">${t('openSettings')}</button></div>`
                : '';
            document.getElementById('gear-btn').classList.toggle('warn', problem);
            if (!html) html = `<div class="status-line ok"><span>${t('allOk')}</span></div>`;
            html += `<button class="btn-test" onclick="testReminder()">${t('test')}</button>`;
            box.innerHTML = html;
        }

        function testReminder() {
            if (!Native) return;
            Native.testReminder(JSON.stringify([
                { name: t('testName1'), dose: '1', type: 'pill' },
                { name: t('testName2'), dose: t('testDose2'), type: 'injection' }
            ]), 60);
            alert(t('testAlert'));
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) renderStatus();
        });

        function deleteMed(index) {
            const meds = loadMeds();
            meds.splice(index, 1);
            saveMeds(meds);
        }

        function renderMeds() {
            const meds = loadMeds();
            list.innerHTML = '';
            meds.forEach((m, idx) => {
                const li = document.createElement('li');
                li.className = 'med-item';
                li.innerHTML = `
                    <div class="med-info">
                        <h3>⏰ ${m.time}</h3>
                        <ul>${m.items.map(it => `<li>${TYPE_ICON[it.type] || '💊'} ${escapeHtml(it.name)}` +
                            `${it.dose ? ' <span style="color:var(--text-muted)">· ' + t('dose') + ': ' + escapeHtml(it.dose) + '</span>' : ''}</li>`).join('')}</ul>
                    </div>
                    <button class="btn-delete" onclick="deleteMed(${idx})">${t('del')}</button>
                `;
                list.appendChild(li);
            });
        }

        const TYPES = ['pill', 'injection', 'drops', 'syrup', 'cream', 'inhaler'];
        const TYPE_ICON = { pill: '💊', injection: '💉', drops: '💧', syrup: '🥄', cream: '🧴', inhaler: '🌬️' };
        const itemRows = document.getElementById('item-rows');

        // M-010: one big readable card per medicine: type buttons with icons, labelled fields
        function addItemRow() {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.dataset.type = 'pill';
            row.innerHTML =
                `<div class="item-head"><span><span data-i18n="item">${t('item')}</span> <span class="it-num"></span></span>` +
                `<button type="button" class="btn-remove-item" data-i18n-title="remove" title="${t('remove')}">✕</button></div>` +
                `<div class="field-label" data-i18n="typeLabel">${t('typeLabel')}</div>` +
                `<div class="type-grid">${TYPES.map(ty =>
                    `<button type="button" class="type-btn${ty === 'pill' ? ' sel' : ''}" data-type="${ty}">` +
                    `<span class="ico">${TYPE_ICON[ty]}</span><span data-i18n="type_${ty}">${t('type_' + ty)}</span></button>`).join('')}</div>` +
                `<div class="field-label" data-i18n="nameLabel">${t('nameLabel')}</div>` +
                `<input type="text" class="it-name" data-i18n-ph="namePh" placeholder="${t('namePh')}">` +
                `<div class="field-label" data-i18n="doseLabel">${t('doseLabel')}</div>` +
                `<input type="text" class="it-dose" data-i18n-ph="dosePh" placeholder="${t('dosePh')}">`;
            row.querySelectorAll('.type-btn').forEach(b => {
                b.onclick = () => {
                    row.querySelectorAll('.type-btn').forEach(x => x.classList.remove('sel'));
                    b.classList.add('sel');
                    row.dataset.type = b.dataset.type;
                    if (navigator.vibrate) navigator.vibrate(15);
                };
            });
            row.querySelector('.btn-remove-item').onclick = () => {
                if (itemRows.children.length > 1) row.remove();
                else { row.querySelector('.it-name').value = ''; row.querySelector('.it-dose').value = ''; }
                numberRows();
            };
            itemRows.appendChild(row);
            numberRows();
        }

        function numberRows() {
            [...itemRows.children].forEach((r, i) => { r.querySelector('.it-num').textContent = i + 1; });
        }

        // ---------- M-010: scroll wheel time picker ----------
        const WHEEL_ITEM = 44;

        function buildWheel(el, count) {
            let html = '<div></div><div></div>';
            for (let i = 0; i < count; i++) html += `<div>${String(i).padStart(2, '0')}</div>`;
            html += '<div></div><div></div>';
            el.innerHTML = html;
            let last = -1, timer = null;
            el.addEventListener('scroll', () => {
                const idx = wheelIndex(el, count);
                if (idx !== last) {
                    last = idx;
                    el.querySelectorAll('div').forEach((d, i) => d.classList.toggle('on', i === idx + 2));
                    if (navigator.vibrate) navigator.vibrate(5);
                }
            });
        }

        function wheelIndex(el, count) {
            return Math.max(0, Math.min(count - 1, Math.round(el.scrollTop / WHEEL_ITEM)));
        }

        function setWheel(el, value) {
            el.scrollTop = value * WHEEL_ITEM;
            el.querySelectorAll('div').forEach((d, i) => d.classList.toggle('on', i === value + 2));
        }

        const wheelH = document.getElementById('wheel-h');
        const wheelM = document.getElementById('wheel-m');
        buildWheel(wheelH, 24);
        buildWheel(wheelM, 60);

        function openTimePicker() {
            const cur = document.getElementById('med-time').value;
            let h, m;
            if (cur) { [h, m] = cur.split(':').map(Number); }
            else { const d = new Date(); h = d.getHours(); m = d.getMinutes(); }
            document.getElementById('time-sheet').classList.add('open');
            setWheel(wheelH, h);
            setWheel(wheelM, m);
        }

        function closeTimePicker() {
            document.getElementById('time-sheet').classList.remove('open');
        }

        function confirmTimePicker() {
            const v = String(wheelIndex(wheelH, 24)).padStart(2, '0') + ':' + String(wheelIndex(wheelM, 60)).padStart(2, '0');
            document.getElementById('med-time').value = v;
            document.getElementById('time-btn').textContent = '⏰ ' + v;
            closeTimePicker();
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const timeInput = document.getElementById('med-time');
            const items = [...itemRows.querySelectorAll('.item-row')].map(r => ({
                type: r.dataset.type || 'pill',
                name: r.querySelector('.it-name').value.trim(),
                dose: r.querySelector('.it-dose').value.trim()
            })).filter(it => it.name);
            if (!items.length) { alert(t('needName')); return; }
            if (!timeInput.value) { openTimePicker(); return; }

            const meds = loadMeds();
            meds.push({ id: newId(), time: timeInput.value, items });
            meds.sort((a, b) => a.time.localeCompare(b.time));
            saveMeds(meds);
            playChime();

            itemRows.innerHTML = '';
            addItemRow();
            timeInput.value = '';
            document.getElementById('time-btn').textContent = '--:--';
        });

        applyLanguage();
        addItemRow();

        document.getElementById('lang-select').addEventListener('change', e => {
            LANG = e.target.value;
            try { localStorage.setItem('medtime_lang', LANG); } catch (err) { }
            applyLanguage();
            // Re-draw the list / status in the new language (typed text is kept)
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
            renderMeds();
            renderStatus();
            renderSounds();
        });

        // ---------- M-011: settings screen ----------
        function openSettingsPage() {
            document.getElementById('settings-page').classList.add('open');
            renderSounds();
            renderStatus();
        }

        function closeSettingsPage() {
            document.getElementById('settings-page').classList.remove('open');
            if (Native && Native.stopPreview) { try { Native.stopPreview(); } catch (e) { } }
        }

        function renderSounds() {
            const box = document.getElementById('sound-list');
            let list = [], chosen = '';
            if (Native && Native.getSounds) {
                try { list = JSON.parse(Native.getSounds()); chosen = Native.getChosenSound() || ''; } catch (e) { }
            }
            const row = (uri, title) =>
                `<div class="sound-row"><label><input type="radio" name="snd" value="${escapeHtml(uri)}"${uri === chosen ? ' checked' : ''}>` +
                `<span>${escapeHtml(title)}</span></label>` +
                (uri === 'none' ? '' : `<button type="button" data-uri="${escapeHtml(uri)}">${t('preview')}</button>`) + `</div>`;
            let html = row('', t('soundDefault')) + row('none', t('soundNone'));
            let lastKind = '';
            list.forEach(sd => {
                if (sd.kind !== lastKind) {
                    lastKind = sd.kind;
                    html += `<div class="sound-group">${t(sd.kind === 'alarm' ? 'soundAlarm' : 'soundNotif')}</div>`;
                }
                html += row(sd.uri, sd.title);
            });
            box.innerHTML = html;
            box.querySelectorAll('input[name=snd]').forEach(r => r.addEventListener('change', () => {
                if (Native && Native.setSound) Native.setSound(r.value);
                if (Native && Native.previewSound && r.value !== 'none') Native.previewSound(r.value);
            }));
            box.querySelectorAll('button[data-uri]').forEach(b => b.addEventListener('click', () => {
                if (Native && Native.previewSound) Native.previewSound(b.dataset.uri);
            }));
        }

        function applyLowVision(on) {
            document.documentElement.classList.toggle('lowvision', on);
            document.getElementById('low-vision').checked = on;
            if (Native && Native.setLowVision) { try { Native.setLowVision(on); } catch (e) { } }
        }

        document.getElementById('low-vision').addEventListener('change', e => {
            try { localStorage.setItem('medtime_lowvision', e.target.checked ? '1' : '0'); } catch (err) { }
            applyLowVision(e.target.checked);
        });
        applyLowVision((() => { try { return localStorage.getItem('medtime_lowvision') === '1'; } catch (e) { return false; } })());

        // M-007: voice options, saved here and in Android
        function loadVoice() {
            try { return Object.assign({ on: true, names: true, dose: true }, JSON.parse(localStorage.getItem('medtime_voice') || '{}')); }
            catch (e) { return { on: true, names: true, dose: true }; }
        }

        function applyVoice(v) {
            document.getElementById('v-on').checked = v.on;
            document.getElementById('v-names').checked = v.names;
            document.getElementById('v-dose').checked = v.dose;
            document.getElementById('row-names').classList.toggle('disabled', !v.on);
            document.getElementById('row-dose').classList.toggle('disabled', !v.on || !v.names);
            if (Native && Native.setVoiceOptions) {
                try { Native.setVoiceOptions(v.on, v.names, v.dose); } catch (e) { }
            }
        }

        ['v-on', 'v-names', 'v-dose'].forEach(idName => {
            document.getElementById(idName).addEventListener('change', () => {
                const v = {
                    on: document.getElementById('v-on').checked,
                    names: document.getElementById('v-names').checked,
                    dose: document.getElementById('v-dose').checked
                };
                localStorage.setItem('medtime_voice', JSON.stringify(v));
                applyVoice(v);
            });
        });
        applyVoice(loadVoice());

        renderMeds();
        syncNative(loadMeds());
        renderStatus();
    </script>
</body>
</html>
