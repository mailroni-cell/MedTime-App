<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedTime</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 480px;
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.6rem;
            color: #38bdf8;
        }

        #canvas-container {
            width: 100%;
            max-width: 480px;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-add:active {
            background: var(--primary-hover);
        }

        .med-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 480px;
        }

        .med-item {
            background: var(--card);
            padding: 14px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid var(--primary);
        }

        .med-info h3 {
            font-size: 1.05rem;
            margin-bottom: 2px;
        }

        .med-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* M-005: reminder status + test button */
        .status-box {
            width: 100%;
            max-width: 480px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-line {
            background: #422006;
            border: 1px solid #f59e0b;
            color: #fde68a;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .status-line.ok {
            background: #052e1c;
            border-color: var(--accent);
            color: #a7f3d0;
        }

        .status-line button, button.btn-test {
            background: transparent;
            border: 1px solid currentColor;
            color: inherit;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        button.btn-test {
            color: #38bdf8;
            padding: 10px;
            font-size: 0.95rem;
        }

        /* M-006: several medicines / injections in one reminder */
        .item-row {
            display: grid;
            grid-template-columns: 90px 1fr 1fr 34px;
            gap: 6px;
        }

        .item-row input, .item-row select {
            min-width: 0;
            padding: 10px 8px;
        }

        select {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .item-row .btn-remove-item {
            background: transparent;
            border: 1px solid #475569;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 1rem;
        }

        button.btn-add-item {
            background: transparent;
            border: 1px dashed #38bdf8;
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .med-info ul {
            list-style: none;
            margin-top: 4px;
        }

        .med-info li {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>MedTime</h1>
    </header>

    <div id="canvas-container"></div>

    <div class="card">
        <form id="med-form" class="form-group">
            <div id="item-rows" class="form-group"></div>
            <button type="button" class="btn-add-item" onclick="addItemRow()">➕ עוד תרופה / זריקה לאותה שעה</button>
            <input type="time" id="med-time" required>
            <button type="submit" class="btn-add">הוסף תזכורת</button>
        </form>
    </div>

    <div id="status-box" class="status-box"></div>

    <ul id="med-list" class="med-list"></ul>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const pillGroup = new THREE.Group();
        const cylinderGeo = new THREE.CylinderGeometry(0.7, 0.7, 1.2, 32);
        const sphereGeo = new THREE.SphereGeometry(0.7, 32, 16);

        const matRed = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, metalness: 0.1 });
        const matWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3, metalness: 0.1 });

        const bodyMesh = new THREE.Mesh(cylinderGeo, matWhite);
        const capTop = new THREE.Mesh(sphereGeo, matRed);
        capTop.position.y = 0.6;
        const capBottom = new THREE.Mesh(sphereGeo, matWhite);
        capBottom.position.y = -0.6;

        pillGroup.add(bodyMesh, capTop, capBottom);
        pillGroup.rotation.z = Math.PI / 4;
        scene.add(pillGroup);

        camera.position.z = 4.5;

        function animate() {
            requestAnimationFrame(animate);
            pillGroup.rotation.y += 0.015;
            pillGroup.rotation.x += 0.008;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.error(e);
            }
        }

        const form = document.getElementById('med-form');
        const list = document.getElementById('med-list');

        // M-005: native Android bridge (exists only inside the app, not in a browser)
        const Native = window.MedTimeNative || null;

        function loadMeds() {
            const data = localStorage.getItem('medtime_list');
            let meds = [];
            try { meds = data ? JSON.parse(data) : []; } catch (e) { meds = []; }
            // Older entries: give them an id, and turn a single name/dose into an items list
            let changed = false;
            meds.forEach((m, i) => {
                if (!m.id) { m.id = newId() + i; changed = true; }
                if (!Array.isArray(m.items)) {
                    m.items = [{ name: m.name || '', dose: m.dose || '', type: 'pill' }];
                    delete m.name; delete m.dose;
                    changed = true;
                }
            });
            if (changed) localStorage.setItem('medtime_list', JSON.stringify(meds));
            return meds;
        }

        function newId() {
            // 1..99,999,999 (fits the Android alarm request code)
            return (Date.now() % 99000000) + 1;
        }

        function syncNative(meds) {
            if (!Native) return;
            try {
                Native.syncReminders(JSON.stringify(meds.map(m => ({
                    id: m.id, time: m.time, items: m.items
                }))));
            } catch (e) { console.error(e); }
        }

        function saveMeds(meds) {
            localStorage.setItem('medtime_list', JSON.stringify(meds));
            syncNative(meds);
            renderMeds();
        }

        const STATUS_TEXT = {
            notifications: 'ההתראות של האפליקציה כבויות',
            exact: 'אין הרשאה לשעון מעורר מדויק',
            fullScreen: 'אין הרשאה למסך תזכורת מלא',
            battery: 'חיסכון בסוללה עלול לעכב תזכורות'
        };

        function renderStatus() {
            const box = document.getElementById('status-box');
            if (!Native) { box.innerHTML = ''; return; }
            let st = {};
            try { st = JSON.parse(Native.getStatus()); } catch (e) { }
            let html = '';
            ['notifications', 'exact', 'fullScreen', 'battery'].forEach(k => {
                if (st[k] === false) {
                    html += `<div class="status-line"><span>⚠️ ${STATUS_TEXT[k]}</span>` +
                        `<button onclick="MedTimeNative.openSettings('${k}')">תקן</button></div>`;
                }
            });
            if (st.tts === 'no_hebrew') {
                html += `<div class="status-line"><span>⚠️ אין קול עברי בטלפון להקראה</span>` +
                    `<button onclick="MedTimeNative.openSettings('tts')">הגדרות קול</button></div>`;
            }
            if (!html) html = `<div class="status-line ok"><span>✅ התזכורות פעילות גם כשהאפליקציה סגורה</span></div>`;
            html += `<button class="btn-test" onclick="testReminder()">🔔 תזכורת ניסיון בעוד דקה</button>`;
            box.innerHTML = html;
        }

        function testReminder() {
            if (!Native) return;
            Native.testReminder(JSON.stringify([
                { name: 'תרופת ניסיון', dose: '1', type: 'pill' },
                { name: 'אינסולין ניסיון', dose: '10 יחידות', type: 'injection' }
            ]), 60);
            alert('תזכורת ניסיון תופיע בעוד דקה. אפשר לסגור את האפליקציה ולנעול את המסך.');
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) renderStatus();
        });

        function deleteMed(index) {
            const meds = loadMeds();
            meds.splice(index, 1);
            saveMeds(meds);
        }

        function renderMeds() {
            const meds = loadMeds();
            list.innerHTML = '';
            meds.forEach((m, idx) => {
                const li = document.createElement('li');
                li.className = 'med-item';
                li.innerHTML = `
                    <div class="med-info">
                        <h3>⏰ ${m.time}</h3>
                        <ul>${m.items.map(it => `<li>${TYPE_ICON[it.type] || '💊'} ${escapeHtml(it.name)}` +
                            `${it.dose ? ' <span style="color:var(--text-muted)">· מינון: ' + escapeHtml(it.dose) + '</span>' : ''}</li>`).join('')}</ul>
                    </div>
                    <button class="btn-delete" onclick="deleteMed(${idx})">מחק</button>
                `;
                list.appendChild(li);
            });
        }

        const TYPES = [
            ['pill', 'כדור'], ['injection', 'זריקה'], ['drops', 'טיפות'],
            ['syrup', 'סירופ'], ['cream', 'משחה'], ['inhaler', 'משאף']
        ];
        const TYPE_ICON = { pill: '💊', injection: '💉', drops: '💧', syrup: '🥄', cream: '🧴', inhaler: '🌬️' };
        const itemRows = document.getElementById('item-rows');

        function addItemRow() {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML =
                `<select class="it-type">${TYPES.map(t => `<option value="${t[0]}">${t[1]}</option>`).join('')}</select>` +
                `<input type="text" class="it-name" placeholder="שם">` +
                `<input type="text" class="it-dose" placeholder="מינון">` +
                `<button type="button" class="btn-remove-item" title="הסר">✕</button>`;
            row.querySelector('.btn-remove-item').onclick = () => {
                if (itemRows.children.length > 1) row.remove();
                else { row.querySelector('.it-name').value = ''; row.querySelector('.it-dose').value = ''; }
            };
            itemRows.appendChild(row);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const timeInput = document.getElementById('med-time');
            const items = [...itemRows.querySelectorAll('.item-row')].map(r => ({
                type: r.querySelector('.it-type').value,
                name: r.querySelector('.it-name').value.trim(),
                dose: r.querySelector('.it-dose').value.trim()
            })).filter(it => it.name);
            if (!items.length) { alert('צריך לכתוב לפחות שם של תרופה אחת'); return; }

            const meds = loadMeds();
            meds.push({ id: newId(), time: timeInput.value, items });
            meds.sort((a, b) => a.time.localeCompare(b.time));
            saveMeds(meds);
            playChime();

            itemRows.innerHTML = '';
            addItemRow();
            timeInput.value = '';
        });

        addItemRow();

        renderMeds();
        syncNative(loadMeds());
        renderStatus();
    </script>
</body>
</html>
