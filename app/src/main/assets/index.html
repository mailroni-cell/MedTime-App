<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MedTime</title>
    <!-- M-013: Three.js bundled in the app (works offline) -->
    <script src="lib/three.min.js"></script>
    <script src="lib/CopyShader.js"></script>
    <script src="lib/LuminosityHighPassShader.js"></script>
    <script src="lib/EffectComposer.js"></script>
    <script src="lib/RenderPass.js"></script>
    <script src="lib/ShaderPass.js"></script>
    <script src="lib/UnrealBloomPass.js"></script>
    <script src="lib/RoomEnvironment.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            /* M-012: use the whole screen, small edge margin + safe areas (notch / round corners) */
            padding: max(26px, calc(8px + env(safe-area-inset-top))) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            align-items: stretch;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: none;
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.6rem;
            color: #38bdf8;
        }

        #canvas-container {
            width: 100%;
            max-width: none;
            height: 18vh;
            min-height: 110px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            max-width: none;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-add:active {
            background: var(--primary-hover);
        }

        .med-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: none;
        }

        .med-item {
            background: var(--card);
            padding: 14px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid var(--primary);
        }

        .med-info h3 {
            font-size: 1.05rem;
            margin-bottom: 2px;
        }

        .med-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* M-005: reminder status + test button */
        .status-box {
            width: 100%;
            max-width: none;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-line {
            background: #422006;
            border: 1px solid #f59e0b;
            color: #fde68a;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .status-line.ok {
            background: #052e1c;
            border-color: var(--accent);
            color: #a7f3d0;
        }

        .status-line button, button.btn-test {
            background: transparent;
            border: 1px solid currentColor;
            color: inherit;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        button.btn-test {
            color: #38bdf8;
            padding: 10px;
            font-size: 0.95rem;
        }

        /* M-006 / M-010: one card per medicine, large and readable */
        .item-row {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: #38bdf8;
        }

        .field-label {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .item-row input {
            font-size: 1.15rem;
            padding: 14px 12px;
        }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .type-btn {
            background: #1e293b;
            border: 2px solid #334155;
            color: var(--text);
            border-radius: 10px;
            padding: 8px 4px;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .type-btn .ico {
            font-size: 1.6rem;
        }

        .type-btn.sel {
            border-color: #38bdf8;
            background: #0c4a6e;
            box-shadow: 0 0 10px rgba(var(--gA), 0.6);
        }

        /* M-010: time button + scroll wheel picker */
        .time-btn {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            border-radius: 10px;
            padding: 14px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            direction: ltr;
        }

        .sheet-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 50;
        }

        .sheet-bg.open {
            display: flex;
        }

        .sheet {
            background: var(--card);
            width: 100%;
            max-width: none;
            border-radius: 18px 18px 0 0;
            padding: 16px 16px 24px;
        }

        .sheet h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .wheels {
            direction: ltr;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .wheel-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .wheel-col small {
            color: var(--text-muted);
        }

        .wheel {
            height: 220px;
            width: 96px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            position: relative;
            -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
            mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
        }

        .wheel::-webkit-scrollbar {
            display: none;
        }

        .wheel div {
            height: 44px;
            line-height: 44px;
            text-align: center;
            font-size: 1.5rem;
            color: var(--text-muted);
            scroll-snap-align: center;
        }

        .wheel div.on {
            color: #f8fafc;
            font-size: 2rem;
            font-weight: 700;
        }

        .wheel-sep {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 20px;
        }

        .wheel-band {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(50% + 10px);
            height: 46px;
            transform: translateY(-50%);
            border-top: 2px solid #38bdf8;
            border-bottom: 2px solid #38bdf8;
            pointer-events: none;
            border-radius: 6px;
        }

        .sheet-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .sheet-actions button {
            padding: 14px;
            border-radius: 10px;
            font-size: 1.05rem;
            border: none;
        }

        select {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .item-row .btn-remove-item {
            background: transparent;
            border: 1px solid #475569;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 1rem;
        }

        button.btn-add-item {
            background: transparent;
            border: 1px dashed #38bdf8;
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .med-info ul {
            list-style: none;
            margin-top: 4px;
        }

        .med-info li {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* M-007: voice options */
        .voice-card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.95rem;
        }

        .switch-row input {
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
        }

        .switch-row.disabled {
            opacity: 0.4;
        }

        /* M-009: language picker */
        header {
            position: relative;
        }

        .lang-select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
        }

        /* M-011: gear button + settings screen */
        .gear-btn {
            position: absolute;
            top: 0;
            inset-inline-start: 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            padding: 2px 6px;
        }

        .gear-btn .badge {
            position: absolute;
            top: 2px;
            inset-inline-end: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f59e0b;
            display: none;
        }

        .gear-btn.warn .badge {
            display: block;
        }

        .settings-page {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 40;
            overflow-y: auto;
            padding: 16px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .settings-page.open {
            display: flex;
        }

        .settings-head {
            width: 100%;
            max-width: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .settings-head h2 {
            color: #38bdf8;
        }

        .settings-head button {
            background: #334155;
            color: var(--text);
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 1rem;
        }

        .settings-page .card h3 {
            font-size: 1.05rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .sound-group {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 10px 0 4px;
        }

        .sound-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }

        .sound-row label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sound-row input {
            width: 20px;
            height: 20px;
            accent-color: #38bdf8;
        }

        .sound-row button {
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            border-radius: 6px;
            padding: 4px 10px;
            white-space: nowrap;
        }

        .sound-list {
            max-height: 320px;
            overflow-y: auto;
        }

        .main-warn {
            width: 100%;
            max-width: none;
            margin-bottom: 16px;
        }

        /* M-011: low-vision display: bigger text, yellow on black */
        html.lowvision {
            font-size: 20px;
        }

        html.lowvision body,
        html.lowvision .settings-page {
            --bg: #000000;
            --card: #000000;
            --text: #ffffff;
            --text-muted: #ffe500;
            background: #000000;
        }

        html.lowvision .card,
        html.lowvision .med-item,
        html.lowvision .item-row {
            border: 2px solid #ffe500;
        }

        html.lowvision input,
        html.lowvision select,
        html.lowvision .time-btn {
            background: #000000;
            border: 2px solid #ffffff;
            color: #ffffff;
        }

        html.lowvision .med-info h3,
        html.lowvision .med-info li {
            color: #ffe500;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* ================= M-013: 3D look ================= */
        html {
            background: #070b1a;
        }

        body {
            background: transparent !important;
            perspective: 1200px;
        }

        #bg3d {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            display: block;
            transition: opacity 0.4s;
        }

        body > *:not(#bg3d):not(script) {
            position: relative;
            z-index: 1;
        }

        .settings-page, .sheet-bg {
            z-index: 40 !important;
            position: fixed !important;
        }

        .hero-space {
            height: 24vh;
            min-height: 140px;
            pointer-events: none;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ffffff 0%, #7dd3fc 45%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(var(--gA), 0.55)) drop-shadow(0 4px 2px rgba(0, 0, 0, 0.6));
        }

        /* glass cards with depth, rim light and inner gloss */
        .card, .med-item {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.62), rgba(15, 23, 42, 0.48)) !important;
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 20px !important;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.18) inset,
                0 -12px 30px rgba(var(--gA), 0.06) inset,
                0 18px 40px rgba(0, 0, 0, 0.55),
                0 4px 12px rgba(0, 0, 0, 0.4);
            transform-style: preserve-3d;
            animation: rise3d 0.7s cubic-bezier(.2, .8, .2, 1) both;
        }

        .card::before, .med-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 38%);
            pointer-events: none;
        }

        .card, .med-item {
            position: relative;
        }

        .med-item {
            border-right: none !important;
            border-inline-start: 5px solid #38bdf8 !important;
            transition: transform 0.25s ease-out;
            will-change: transform;
        }

        .med-list .med-item:nth-child(2) { animation-delay: 0.08s; }
        .med-list .med-item:nth-child(3) { animation-delay: 0.16s; }
        .med-list .med-item:nth-child(4) { animation-delay: 0.24s; }
        .med-list .med-item:nth-child(n+5) { animation-delay: 0.3s; }

        @keyframes rise3d {
            from { opacity: 0; transform: translateY(40px) rotateX(18deg) scale(0.96); }
            to { opacity: 1; transform: none; }
        }

        .item-row {
            background: rgba(2, 6, 23, 0.55) !important;
            border: 1px solid rgba(var(--gA), 0.25) !important;
            border-radius: 16px !important;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45) inset, 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        input, select, .time-btn {
            background: rgba(15, 23, 42, 0.75) !important;
            border: 1px solid rgba(148, 163, 184, 0.35) !important;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5) inset;
        }

        input:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5) inset, 0 0 0 3px rgba(var(--gA), 0.25);
        }

        /* pneumatic 3D buttons: raised edge, glow, press down */
        button.btn-add {
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 55%, #1d4ed8 100%) !important;
            border-radius: 14px !important;
            padding: 16px !important;
            font-size: 1.15rem !important;
            box-shadow: 0 6px 0 #1e3a8a, 0 10px 24px rgba(37, 99, 235, 0.55), 0 1px 0 rgba(255, 255, 255, 0.4) inset;
            transform: translateY(0);
            transition: transform 0.08s, box-shadow 0.08s;
        }

        button.btn-add:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #1e3a8a, 0 4px 10px rgba(37, 99, 235, 0.5), 0 1px 0 rgba(255, 255, 255, 0.3) inset;
        }

        .type-btn {
            background: linear-gradient(180deg, rgba(51, 65, 85, 0.9), rgba(30, 41, 59, 0.9)) !important;
            box-shadow: 0 4px 0 rgba(2, 6, 23, 0.9), 0 6px 14px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.15) inset;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .type-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(2, 6, 23, 0.9), 0 2px 6px rgba(0, 0, 0, 0.45);
        }

        .type-btn.sel {
            background: linear-gradient(180deg, #0e7490, #0c4a6e) !important;
            box-shadow: 0 4px 0 #082f49, 0 0 18px rgba(var(--gA), 0.8), 0 1px 0 rgba(255, 255, 255, 0.3) inset !important;
        }

        .type-btn .ico {
            filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.6));
            transition: transform 0.3s;
        }

        .type-btn.sel .ico {
            transform: scale(1.18) rotate(-8deg);
        }

        .time-btn {
            font-size: 2.2rem !important;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9)) !important;
            color: #e0f2fe !important;
            text-shadow: 0 0 14px rgba(var(--gA), 0.8);
            box-shadow: 0 5px 0 rgba(2, 6, 23, 0.9), 0 10px 22px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.12) inset !important;
        }

        button.btn-add-item {
            background: rgba(var(--gA), 0.08) !important;
            border-radius: 14px !important;
        }

        .gear-btn {
            filter: drop-shadow(0 0 8px rgba(var(--gA), 0.6));
            transition: transform 0.6s;
        }

        .gear-btn:active {
            transform: rotate(120deg);
        }

        .med-info h3 {
            font-size: 1.35rem !important;
            color: #e0f2fe;
            text-shadow: 0 0 10px rgba(var(--gA), 0.6);
        }

        .med-info li {
            font-size: 1.05rem !important;
        }

        .sheet {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.96)) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.6);
            animation: sheetUp 0.35s cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes sheetUp {
            from { transform: translateY(100%); }
            to { transform: none; }
        }

        .settings-page {
            background: rgba(7, 11, 26, 0.72) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* wide screens / landscape: form and list side by side */
        @media (min-width: 760px) {
            body {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                column-gap: 14px;
                align-content: start;
            }
            header, .hero-space, #main-warn {
                grid-column: 1 / -1;
            }
        }

        html.lowvision .card,
        html.lowvision .med-item {
            background: #000 !important;
            backdrop-filter: none;
        }

        /* ================= M-014: settings screen redesign ================= */
        .settings-page {
            padding: max(22px, env(safe-area-inset-top)) 12px 16px !important;
            align-items: stretch !important;
        }

        .settings-hero {
            position: relative;
            text-align: center;
            padding: 6px 0 14px;
        }

        .hero-gear {
            font-size: 4.2rem;
            line-height: 1;
            filter: drop-shadow(0 0 18px rgba(var(--gA), 0.8)) drop-shadow(0 8px 6px rgba(0, 0, 0, 0.6));
            animation: gearSpin 14s linear infinite;
            display: inline-block;
        }

        @keyframes gearSpin {
            to { transform: rotate(360deg); }
        }

        .settings-hero h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-top: 6px;
            background: linear-gradient(180deg, #ffffff, #7dd3fc 50%, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(var(--gA), 0.5));
        }

        .close-3d {
            position: absolute;
            top: 4px;
            inset-inline-end: 0;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            color: #fff;
            background: radial-gradient(circle at 35% 30%, #64748b, #1e293b 70%);
            box-shadow: 0 5px 0 #020617, 0 10px 20px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.3) inset;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .close-3d:active {
            transform: translateY(4px);

        /* ================= M-017: frameless floating controls, centred text ================= */
        .card {

        .chip-x { background: rgba(0, 0, 0, 0.35) !important; border: none !important; color: #fff; border-radius: 50%; width: 30px; height: 30px; padding: 0; font-size: 0.9rem; }
        @keyframes chipIn { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
        button.btn-add-item { display: flex !important; align-items: center; justify-content: center; gap: 12px; padding: 8px 12px !important; }
        .plus-orb {
            display: inline-flex; align-items: center; justify-content: center; flex: none;

            animation: orbPulse 2.4s ease-in-out infinite;
        }

        /* ================= M-023: smaller type buttons, list screen, dose units ================= */
        .type-grid { gap: 8px !important; }
        .type-btn { padding: 7px 4px !important; font-size: 0.95rem !important; border-radius: 18px !important; }
        .type-btn .ico { font-size: 1.75rem !important; }
        .dose-wrap { position: relative; width: 100%; }
        .dose-wrap input { width: 100%; box-sizing: border-box; }
        .dose-units {
            display: none; flex-wrap: wrap; justify-content: center; gap: 6px;
            position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 40;
            padding: 8px; border-radius: 22px; background: rgba(10, 14, 40, 0.9);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(var(--gA), 0.35);
        }
        .dose-wrap:focus-within .dose-units { display: flex; }

        .unit-chip {
            border: none !important; border-radius: 999px; padding: 9px 14px; font-size: 1.05rem; font-weight: 700; color: #fff;
            background: linear-gradient(180deg, rgba(var(--gA), 0.45), rgba(124, 58, 237, 0.45));

        }
        .unit-chip:active { transform: scale(0.94); }
        .list-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            border: none !important; border-radius: 999px; padding: 10px 14px; color: #fff; font-size: 1.05rem; font-weight: 700;
            background: linear-gradient(180deg, rgba(var(--gB), 0.55), rgba(76, 29, 149, 0.6));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 0 16px 3px rgba(var(--gB), 0.7), 0 0 34px 8px rgba(var(--gA), 0.25);
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
        }
        .lb-count { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #6d28d9; font-weight: 900; text-shadow: none; }
        .lb-next { font-weight: 500; opacity: 0.9; }
        .list-btn.bump { animation: lbBump 0.7s cubic-bezier(.2, .8, .2, 1); }
        @keyframes lbBump { 0% { transform: scale(1); } 35% { transform: scale(1.12); box-shadow: 0 0 30px 10px rgba(var(--gB), 1); } 100% { transform: scale(1); } }
        .list-page { z-index: 45 !important; background: radial-gradient(ellipse at 50% 0%, rgba(76, 29, 149, 0.55), rgba(7, 11, 26, 0.94) 70%) !important; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .list-page .med-list { width: 100%; margin: 0; padding: 0; }

        /* ================= M-024: suggestions open above the field, keyboard covers below ================= */
        .suggest { top: auto !important; bottom: calc(100% + 8px); flex-direction: column-reverse !important; overflow-y: auto; }
        .dose-units { top: auto !important; bottom: calc(100% + 8px); }

        /* ================= M-025: time wheel sheet always fully on screen ================= */
        /* perspective on body made fixed layers (sheet, pages) position against the body instead of the screen */
        body { perspective: none !important; }
        .med-list, .card { perspective: 1200px; }
        .sheet-bg { height: 100vh; height: 100dvh; align-items: center !important; padding: 12px; box-sizing: border-box; }
        .sheet { border-radius: 26px !important; max-height: 100%; overflow-y: auto; padding-bottom: calc(16px + env(safe-area-inset-bottom)) !important; }

        /* ================= M-026: dose picker + quick times ================= */
        .dose-units { display: none !important; }
        .ds-units { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 6px 0 14px; }
        .unit-chip.sel { background: linear-gradient(180deg, #22d3ee, #0e7490) !important; box-shadow: 0 0 0 2px #cffafe, 0 0 18px 4px rgba(var(--gA), 0.9) !important; }
        .qty-row { display: flex; align-items: center; justify-content: center; gap: 18px; direction: ltr; }
        .qty-btn {
            width: 72px; height: 72px; border-radius: 50%; border: none !important; font-size: 2.6rem; font-weight: 900; color: #fff; line-height: 1;
            background: radial-gradient(circle at 35% 30%, #a5f3fc, #06b6d4 55%, #7c3aed);
            box-shadow: 0 0 14px 3px rgba(var(--gA), 0.8), 0 0 30px 8px rgba(var(--gB), 0.45), inset 0 2px 3px rgba(255, 255, 255, 0.6);
            touch-action: none; user-select: none;
        }
        .qty-btn:active { transform: scale(0.92); }
        .qty-val { min-width: 120px; text-align: center; font-size: 3.4rem; font-weight: 800; color: #fff; text-shadow: 0 0 16px rgba(var(--gA), 0.9); }
        .ds-preview { text-align: center; font-size: 1.3rem; color: #fde68a; margin: 10px 0 4px; min-height: 1.6em; }
        .ds-manual { display: block; margin: 4px auto 0; background: none !important; border: none !important; color: #93c5fd; font-size: 1rem; text-decoration: underline; }
        .quick-times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
        .quick-times button {
            border: none !important; border-radius: 16px; padding: 8px 2px; color: #fff; font-size: 0.85rem;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            background: linear-gradient(180deg, rgba(var(--gA), 0.3), rgba(124, 58, 237, 0.35));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 0 10px rgba(var(--gA), 0.5);
        }
        .quick-times b { font-size: 1.15rem; direction: ltr; }

        /* ================= M-028: themes ================= */
        :root { --gA: 34, 211, 238; --gB: 168, 85, 247; }
        .set-grid .set-tile:last-child { grid-column: auto !important; }
        .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 4px 2px 10px; }
        .theme-sw {
            border: none !important; border-radius: 18px; padding: 0; overflow: hidden; color: #fff; position: relative;
            aspect-ratio: 1 / 1.05; display: flex; align-items: flex-end; justify-content: center;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: transform 0.15s;
        }
        .theme-sw:active { transform: scale(0.95); }
        .theme-sw .tw-name { width: 100%; padding: 6px 4px; font-size: 0.82rem; font-weight: 700; background: linear-gradient(transparent, rgba(0, 0, 0, 0.75)); text-shadow: 0 1px 3px #000; }
        .theme-sw .tw-dot { position: absolute; top: 10px; width: 22px; height: 22px; border-radius: 50%; }
        .theme-sw.sel { box-shadow: 0 0 0 3px #fff, 0 0 22px 6px rgba(var(--gA), 0.9) !important; }
        .theme-sw.sel::after { content: '✓'; position: absolute; top: 6px; inset-inline-end: 8px; font-weight: 900; font-size: 1.2rem; text-shadow: 0 0 6px #000; }

        /* ================= M-029: theme preview + auto theme ================= */
        .theme-auto { background: linear-gradient(135deg, #f97316 0%, #facc15 25%, #60a5fa 50%, #7c3aed 75%, #0f172a 100%) !important; }
        .theme-auto .ta-ico { position: absolute; top: 18%; font-size: 1.6rem; }
        .theme-bar {
            position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 60;
            display: none; flex-direction: column; gap: 10px; padding: 14px; border-radius: 26px;
            background: rgba(8, 10, 30, 0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 0 0 1.5px rgba(var(--gA), 0.6), 0 0 24px 4px rgba(var(--gA), 0.5), 0 18px 40px rgba(0, 0, 0, 0.6);
            animation: chipIn 0.3s cubic-bezier(.2, .8, .2, 1);
        }
        body.theme-preview .theme-bar { display: flex; }
        body.theme-preview #settings-page { opacity: 0; pointer-events: none; transition: opacity 0.25s; }
        .tb-name { text-align: center; color: #fff; font-size: 1.3rem; font-weight: 800; text-shadow: 0 0 12px rgba(var(--gA), 0.9); }
        .tb-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tb-btns button { border: none !important; border-radius: 999px; padding: 14px; font-size: 1.15rem; font-weight: 800; color: #fff; }
        .tb-back { background: rgba(255, 255, 255, 0.14) !important; }
        .tb-ok { background: linear-gradient(180deg, rgba(var(--gA), 1), rgba(var(--gB), 1)) !important; box-shadow: 0 0 18px 4px rgba(var(--gA), 0.7); }

        /* ================= M-031: close button ================= */
        .exit-btn {
            position: absolute; top: 0; inset-inline-end: 0; border: none; background: transparent;
            font-size: 1.5rem; color: #fca5a5; padding: 2px 8px; font-weight: 900;
            filter: drop-shadow(0 0 8px rgba(248, 113, 113, 0.8));
        }
        .exit-btn:active { transform: scale(0.9); }

        /* ---------- M-032: volume sliders ---------- */
        .vol-row { padding: 12px 0 4px; }
        .vol-row .vol-head { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; margin-bottom: 8px; }
        .vol-row .vol-val { font-weight: 700; color: #67e8f9; min-width: 3.2em; text-align: center; }
        .vol-note { font-size: 0.85rem; opacity: 0.7; padding: 2px 0 10px; }
        input.vol {
            -webkit-appearance: none; appearance: none; width: 100%; height: 14px; border-radius: 999px; border: none; padding: 0;
            background: linear-gradient(90deg, rgba(var(--gA), 1) 0%, rgba(var(--gB), 1) var(--p, 50%), rgba(148, 163, 184, 0.25) var(--p, 50%));
            box-shadow: 0 0 12px rgba(var(--gA), 0.45), inset 0 1px 3px rgba(0, 0, 0, 0.6);
        }
        input.vol::-webkit-slider-thumb {
            -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff, #a5f3fc 40%, #0891b2);
            box-shadow: 0 0 16px rgba(var(--gA), 0.9), 0 3px 6px rgba(0, 0, 0, 0.6);
        }

        /* ---------- M-032: opening animation (every launch) ---------- */
        #splash {
            position: fixed; inset: 0; z-index: 10000; overflow: hidden; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff; cursor: pointer;
            background: radial-gradient(ellipse at 50% 42%, #1e1b4b 0%, #0b1026 45%, #02030a 100%);
            transition: opacity 0.7s ease, transform 0.7s ease, filter 0.7s ease;
        }
        #splash, #welcome { position: fixed !important; }
        #splash { z-index: 10000 !important; }
        #welcome { z-index: 9999 !important; }
        #splash.out { opacity: 0; transform: scale(1.35); filter: blur(6px); pointer-events: none; }
        #splash .sp-star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
            box-shadow: 0 0 6px #fff; animation: spTwinkle 1.6s ease-in-out infinite alternate; opacity: 0; }
        @keyframes spTwinkle { from { opacity: 0.1; transform: scale(0.6); } to { opacity: 1; transform: scale(1.2); } }
        #splash .sp-stage { position: relative; width: 44vmin; height: 44vmin; display: flex; align-items: center; justify-content: center; perspective: 600px; }
        #splash .sp-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(103, 232, 249, 0.8);
            box-shadow: 0 0 30px rgba(103, 232, 249, 0.6), inset 0 0 30px rgba(168, 85, 247, 0.5); opacity: 0;
            animation: spRing 2.2s ease-out infinite; }
        #splash .sp-ring.r2 { animation-delay: 0.7s; border-color: rgba(192, 132, 252, 0.8); }
        #splash .sp-ring.r3 { animation-delay: 1.4s; }
        @keyframes spRing { 0% { transform: scale(0.2); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
        #splash .sp-cap { width: 15vmin; height: 36vmin; border-radius: 8vmin; position: relative; transform-style: preserve-3d;
            animation: spCapIn 1.3s cubic-bezier(.2, 1.4, .4, 1) both, spCapSpin 3.2s linear 1.3s infinite;
            filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.9)) drop-shadow(0 0 40px rgba(239, 68, 68, 0.6)); }
        #splash .sp-cap::before, #splash .sp-cap::after { content: ""; position: absolute; left: 0; right: 0; height: 50%; }
        #splash .sp-cap::before { top: 0; border-radius: 8vmin 8vmin 0 0;
            background: linear-gradient(90deg, #7f1d1d, #ef4444 35%, #fecaca 50%, #ef4444 65%, #7f1d1d); }
        #splash .sp-cap::after { bottom: 0; border-radius: 0 0 8vmin 8vmin;
            background: linear-gradient(90deg, #1e3a8a, #3b82f6 35%, #dbeafe 50%, #3b82f6 65%, #1e3a8a); }
        @keyframes spCapIn { 0% { transform: scale(0) rotateZ(-540deg) rotateX(60deg); opacity: 0; } 100% { transform: scale(1) rotateZ(35deg) rotateX(0); opacity: 1; } }
        @keyframes spCapSpin { from { transform: rotateZ(35deg) rotateY(0); } to { transform: rotateZ(35deg) rotateY(360deg); } }
        #splash .sp-title { margin-top: 4vmin; font-size: clamp(2.6rem, 13vmin, 6rem); font-weight: 800; letter-spacing: 0.04em; direction: ltr; }
        #splash .sp-title span { display: inline-block; opacity: 0;
            background: linear-gradient(180deg, #fff, #67e8f9 55%, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 14px rgba(103, 232, 249, 0.85));
            animation: spLetter 0.7s cubic-bezier(.2, 1.6, .4, 1) forwards; }
        @keyframes spLetter { 0% { opacity: 0; transform: translateY(-60px) scale(2.2) rotateX(90deg); } 100% { opacity: 1; transform: none; } }
        #splash .sp-tag { margin-top: 1.2vmin; font-size: clamp(1rem, 5vmin, 1.6rem); opacity: 0; color: #c7d2fe;
            animation: spFade 0.8s ease 1.5s forwards; text-shadow: 0 0 12px rgba(129, 140, 248, 0.9); }
        #splash .sp-credit { position: absolute; bottom: calc(7vh + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
            font-size: clamp(1rem, 4.6vmin, 1.5rem); font-weight: 600; opacity: 0; padding: 0 16px;
            background: linear-gradient(90deg, #fbbf24, #fff7ed 45%, #f472b6 55%, #fbbf24) 0 0 / 200% 100%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: spFade 0.9s ease 1.9s forwards, spShine 2.4s linear 1.9s infinite; }
        @keyframes spFade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @keyframes spShine { to { background-position: -200% 0; } }

        /* ---------- M-032: first launch: choose language ---------- */
        #welcome {
            position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 2.4vh; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
            background: radial-gradient(ellipse at 50% 30%, #1e1b4b, #02030a 85%); color: #fff;
            transition: opacity 0.5s ease;
        }
        #welcome.show { display: flex; animation: spFade 0.6s ease both; }
        #welcome.out { opacity: 0; }
        #welcome .wl-globe { font-size: 4.2rem; filter: drop-shadow(0 0 18px rgba(103, 232, 249, 0.9)); animation: wlSpin 6s linear infinite; }
        @keyframes wlSpin { 0%, 100% { transform: rotateY(0) } 50% { transform: rotateY(180deg) } }
        #welcome .wl-title { font-size: clamp(1.6rem, 7vmin, 2.4rem); font-weight: 800; text-align: center; min-height: 1.4em;
            text-shadow: 0 0 16px rgba(103, 232, 249, 0.8); transition: opacity 0.35s; }
        #welcome .wl-langs { display: grid; grid-template-columns: 1fr; gap: 1.6vh; width: min(100%, 420px); }
        #welcome .wl-langs button {
            display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 1.5rem; font-weight: 700; color: #fff;
            padding: 2vh 14px; border-radius: 22px; border: 2px solid rgba(103, 232, 249, 0.35);
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            box-shadow: 0 5px 0 #020617, 0 0 18px rgba(var(--gA), 0.35); transition: transform 0.12s, box-shadow 0.2s;
        }
        #welcome .wl-langs button .flag { font-size: 1.9rem; }
        #welcome .wl-langs button:active { transform: translateY(4px); box-shadow: 0 1px 0 #020617; }
        #welcome .wl-langs button.sel { border-color: #67e8f9; background: linear-gradient(180deg, #0e7490, #0c4a6e);
            box-shadow: 0 5px 0 #082f49, 0 0 28px rgba(var(--gA), 0.9); }
        #welcome .wl-note { font-size: 1.1rem; text-align: center; color: #c7d2fe; min-height: 2.6em; max-width: 420px; }
        #welcome .wl-go { font-size: 1.5rem; font-weight: 800; padding: 1.8vh 48px; border-radius: 999px; border: none; color: #022c22;
            background: linear-gradient(180deg, #6ee7b7, #10b981); box-shadow: 0 5px 0 #065f46, 0 0 30px rgba(16, 185, 129, 0.9);
            visibility: hidden; }
        #welcome .wl-go.on { visibility: visible; animation: spFade 0.4s ease both; }

        /* ================= M-035: sharp, readable text (older eyes) ================= */
        /* glow behind letters made them look blurred: keep the glow on the button, letters get only a thin dark outline */
        html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
        body { font-weight: 600; }
        .field-label, .item-head, button.btn-add-item, .time-btn, .type-btn, .set-title, .set-sub, .p-title,
        .toggle-row, .sound-row, .lang-btn, .lb-label, .it-chip, .med-item, .tb-name, .tb-empty, .vol-head, header h1 {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95), 0 0 1px rgba(0, 0, 0, 0.9) !important;
            color: #ffffff !important;
        }
        .set-sub, .vol-val { color: #a5f3fc !important; }
        .set-title { font-size: 1.3rem !important; font-weight: 800 !important; }
        .set-sub { font-size: 1.05rem !important; font-weight: 700 !important; }
        .type-btn { font-size: 1.08rem !important; font-weight: 800 !important; }
        .time-btn, button.btn-add-item, .tb-empty { font-size: 1.3rem !important; font-weight: 800 !important; }
        #med-form input[type=text] { font-size: 1.3rem !important; font-weight: 700 !important; }
        #med-form input[type=text]::placeholder { color: rgba(255, 255, 255, 0.92) !important; font-weight: 700; }
        .toggle-row, .sound-row { font-size: 1.2rem !important; }
        /* brightness filter animation re-drew the text soft on the phone: glow stays, without the filter */
        #med-form input[type=text], .type-btn, .time-btn, button.btn-add-item { animation: none !important; filter: none !important; }
        /* 3D tilt of the reminder cards blurred their text */
        .med-item { transform: none !important; }

        /* ================= M-036: doctor appointments ================= */
        .nav-row { display: flex; gap: 10px; width: 100%; }
        .nav-row > button { flex: 1 1 0; min-width: 0; }
        .nav-row .list-btn { flex-wrap: wrap; row-gap: 2px; padding: 8px 10px; }
        .nav-row .list-btn .lb-next { flex-basis: 100%; text-align: center; font-size: 0.95rem; }
        .appt-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px; border: none !important; border-radius: 999px;
            padding: 8px 10px; color: #fff; font-weight: 800;
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.6), rgba(4, 120, 87, 0.65));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 0 16px 3px rgba(16, 185, 129, 0.65), 0 0 34px 8px rgba(var(--gA), 0.2);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95);
        }
        .appt-btn .ab-ico { font-size: 1.7rem; }
        .appt-btn .ab-txt { display: flex; flex-direction: column; align-items: center; line-height: 1.2; min-width: 0; }
        .appt-btn .ab-title { font-size: 1.05rem; }
        .appt-btn .ab-sub { font-size: 0.92rem; font-weight: 700; color: #d1fae5; }
        .appt-btn .ab-count { color: #047857; }
        .appt-page, .appt-form-page { z-index: 46 !important; }
        .appt-form-page { z-index: 50 !important; padding-bottom: calc(24px + var(--kb, 0px)) !important; }
        .appt-page { justify-content: flex-start; }
        .appt-new {
            display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 560px; margin: 4px 0 14px;
            padding: 14px; border: none !important; border-radius: 999px; color: #fff; font-size: 1.35rem; font-weight: 800;
            background: linear-gradient(180deg, #10b981, #047857);
            box-shadow: 0 5px 0 #064e3b, 0 0 26px 4px rgba(16, 185, 129, 0.8);
        }
        .appt-list { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
        .ap-card {
            display: flex; gap: 12px; align-items: stretch; padding: 14px; border-radius: 22px; color: #fff;
            background: linear-gradient(160deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.94));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 0 0 1.5px rgba(16, 185, 129, 0.45), 0 0 22px rgba(16, 185, 129, 0.3), 0 12px 26px rgba(0, 0, 0, 0.55);
        }
        .ap-card.past { opacity: 0.55; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1); }

    <script>
        (function () {

            var TX = {

                ar: { tag: 'أدويتك في وقتها', credit: '© روني 2026', pick: 'اختر اللغة', note: 'يمكن تغيير اللغة في أي وقت من الإعدادات ⚙️', go: 'متابعة ✓', dir: 'rtl' },

            };
            var stored = null;

                if (done) return; done = true; window.__splashEnd = performance.now();
                sp.classList.add('out');
                setTimeout(function () { sp.remove(); }, 750);
                if (!TX[stored]) showWelcome();
            };
            setTimeout(window.endSplash, 3600);

            function showWelcome() {
                var w = document.getElementById('welcome'), title = document.getElementById('wl-title'),
                    note = document.getElementById('wl-note'), go = document.getElementById('wl-go');
                var order = ['he', 'ar', 'ro', 'fr', 'en'], k = 0, chosen = null;
                w.classList.add('show');
                // Title changes language every 1.6 s until one is chosen
                var cyc = setInterval(function () {
                    if (chosen) return;
                    title.style.opacity = 0;
                    setTimeout(function () { if (chosen) return; k = (k + 1) % 5; title.textContent = TX[order[k]].pick; title.dir = TX[order[k]].dir; title.style.opacity = 1; }, 350);
                }, 1600);
                w.querySelectorAll('.wl-langs button').forEach(function (b) {
                    b.addEventListener('click', function () {
                        chosen = b.dataset.lang;
                        w.querySelectorAll('.wl-langs button').forEach(function (x) { x.classList.toggle('sel', x === b); });
                        var tx = TX[chosen];
                        title.textContent = tx.pick; title.dir = tx.dir; title.style.opacity = 1;
                        note.textContent = tx.note; note.dir = tx.dir;
                        go.textContent = tx.go; go.classList.add('on');
                        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) { } }
                        var sel = document.getElementById('lang-select');
                        if (sel) { sel.value = chosen; sel.dispatchEvent(new Event('change')); }
                    });
                });
                go.addEventListener('click', function () {
                    if (!chosen) return;
                    clearInterval(cyc);
                    try { localStorage.setItem('medtime_lang', chosen); } catch (e) { }
                    w.classList.add('out');
                    setTimeout(function () { w.remove(); }, 500);
                });
            }
        })();
    </script>

    <script>
        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.error(e);
            }
        }

        const form = document.getElementById('med-form');
        const list = document.getElementById('med-list');

        // M-005: native Android bridge (exists only inside the app, not in a browser)
        const Native = window.MedTimeNative || null;

        function loadMeds() {
            const data = localStorage.getItem('medtime_list');
            let meds = [];
            try { meds = data ? JSON.parse(data) : []; } catch (e) { meds = []; }
            // Older entries: give them an id, and turn a single name/dose into an items list
            let changed = false;
            meds.forEach((m, i) => {
                if (!m.id) { m.id = newId() + i; changed = true; }
                if (!Array.isArray(m.items)) {
                    m.items = [{ name: m.name || '', dose: m.dose || '', type: 'pill' }];
                    delete m.name; delete m.dose;
                    changed = true;
                }
            });
            if (changed) localStorage.setItem('medtime_list', JSON.stringify(meds));
            return meds;
        }

        function newId() {
            // 1..99,999,999 (fits the Android alarm request code)
            return (Date.now() % 99000000) + 1;
        }

        function syncNative(meds) {
            if (!Native) return;
            try {
                Native.syncReminders(JSON.stringify(meds.map(m => ({
                    id: m.id, time: m.time, items: m.items, days: m.days || []
                }))));
            } catch (e) { console.error(e); }
        }

        function saveMeds(meds) {
            localStorage.setItem('medtime_list', JSON.stringify(meds));
            syncNative(meds);
            renderMeds();
        }

        const RTL_LANGS = ['he', 'ar'];
        let LANG = 'he';
        try { LANG = localStorage.getItem('medtime_lang') || 'he'; } catch (e) { }
        if (!I18N[LANG]) LANG = 'he';

        function t(key) {
            return (I18N[LANG] && I18N[LANG][key]) || I18N.he[key] || key;
        }

        function applyLanguage() {
            document.documentElement.lang = LANG;
            document.documentElement.dir = RTL_LANGS.includes(LANG) ? 'rtl' : 'ltr';
            document.getElementById('lang-select').value = LANG;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
            document.querySelectorAll('[data-i18n-strip]').forEach(el => { el.textContent = t(el.dataset.i18nStrip).replace(/^\S+\s/, ''); });
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('sel', b.dataset.lang === LANG));
            if (typeof updateSettingsSummary === 'function') updateSettingsSummary();
            if (Native && Native.setLanguage) {
                try { Native.setLanguage(LANG); } catch (e) { }
            }
        }

        function renderStatus() {
            const box = document.getElementById('status-box');
            if (!Native) { box.innerHTML = ''; return; }
            let st = {};
            try { st = JSON.parse(Native.getStatus()); } catch (e) { }
            let html = '';
            ['notifications', 'exact', 'fullScreen', 'battery'].forEach(k => {
                if (st[k] === false) {
                    html += `<div class="status-line"><span>⚠️ ${t('st_' + k)}</span>` +
                        `<button onclick="MedTimeNative.openSettings('${k}')">${t('fix')}</button></div>`;
                }
            });
            if (st.tts === 'no_voice' || st.tts === 'no_hebrew') {
                html += `<div class="status-line"><span>⚠️ ${t('noVoice')}</span>` +
                    `<button onclick="MedTimeNative.openSettings('tts')">${t('voiceSettings')}</button></div>`;
            }
            const problem = !!html;
            lastStatusProblem = problem;
            // Main screen: only a short line when something needs fixing; details live in settings
            document.getElementById('main-warn').innerHTML = problem
                ? `<div class="status-line"><span>${t('problemMain')}</span><button onclick="openSettingsPage()">${t('openSettings')}</button></div>`
                : '';
            document.getElementById('gear-btn').classList.toggle('warn', problem);
            if (!html) html = `<div class="status-line ok"><span>${t('allOk')}</span></div>`;
            html += `<button class="btn-test" onclick="testReminder()">${t('test')}</button>`;
            box.innerHTML = html;
        }

        function testReminder() {
            if (!Native) return;
            Native.testReminder(JSON.stringify([
                { name: t('testName1'), dose: '1', type: 'pill' },
                { name: t('testName2'), dose: t('testDose2'), type: 'injection' }
            ]), 60);
            alert(t('testAlert'));
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) renderStatus();
        });

        function deleteMed(index) {
            const meds = loadMeds();
            meds.splice(index, 1);
            saveMeds(meds);
        }

        function updateListBtn() {
            const meds = loadMeds();
            const btn = document.getElementById('list-btn');
            if (!meds.length) { btn.style.display = 'none'; return; }
            btn.style.display = '';
            const now = new Date(), cur = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            const next = (meds.find(m => m.time > cur) || meds[0]).time;
            btn.innerHTML = `<span class="lb-count">${meds.length}</span><span class="lb-title"></span><span class="lb-next">⏰ <span class="lb-nt"></span> ${next}</span>`;
            btn.querySelector('.lb-title').textContent = t('myReminders');
            btn.querySelector('.lb-nt').textContent = t('nextAt');
        }
        function openListPage() { document.getElementById('list-page').classList.add('open'); }
        function closeListPage() { document.getElementById('list-page').classList.remove('open'); }

        function renderMeds() {
            updateListBtn();
            const meds = loadMeds();
            if (!meds.length) closeListPage();
            list.innerHTML = '';
            meds.forEach((m, idx) => {
                const li = document.createElement('li');
                li.className = 'med-item';
                li.innerHTML = `
                    <div class="med-info">
                        <h3>⏰ ${m.time}${m.days && m.days.length && m.days.length < 7 ? ' <span class="med-days">📅 ' + escapeHtml(daysText(m.days)) + '</span>' : ''}</h3>
                        <ul>${m.items.map(it => `<li>${TYPE_ICON[it.type] || '💊'} ${escapeHtml(it.name)}` +
                            `${it.dose ? ' <span style="color:var(--text-muted)">· ' + t('dose') + ': ' + escapeHtml(it.dose) + '</span>' : ''}</li>`).join('')}</ul>
                    </div>
                    <button class="btn-delete" onclick="deleteMed(${idx})">${t('del')}</button>
                `;
                list.appendChild(li);
            });
        }

        const TYPES = ['pill', 'injection', 'drops', 'syrup', 'cream', 'inhaler'];
        const TYPE_ICON = { pill: '💊', injection: '💉', drops: '💧', syrup: '🥄', cream: '🧴', inhaler: '🌬️' };
        const itemRows = document.getElementById('item-rows');

        // M-010: one big readable card per medicine: type buttons with icons, labelled fields
        function addItemRow() {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.dataset.type = 'pill';
            row.innerHTML =
                `<div class="item-head"><span><span data-i18n="item">${t('item')}</span> <span class="it-num"></span></span>` +

        // M-023: dose unit templates by medicine type (shown while typing the dose)

        const WHEEL_ITEM = 44;

        }

        function applyVoice(v) {
            document.getElementById('v-on').checked = v.on;
            document.getElementById('v-names').checked = v.names;
            document.getElementById('v-dose').checked = v.dose;
            document.getElementById('row-names').classList.toggle('disabled', !v.on);
            document.getElementById('row-dose').classList.toggle('disabled', !v.on || !v.names);
            if (Native && Native.setVoiceOptions) {
                try { Native.setVoiceOptions(v.on, v.names, v.dose); } catch (e) { }
            }
        }

        ['v-on', 'v-names', 'v-dose'].forEach(idName => {
            document.getElementById(idName).addEventListener('change', () => {
                const v = {
                    on: document.getElementById('v-on').checked,
                    names: document.getElementById('v-names').checked,
                    dose: document.getElementById('v-dose').checked
                };
                localStorage.setItem('medtime_voice', JSON.stringify(v));
                applyVoice(v);
                updateSettingsSummary();
            });
        });
        applyVoice(loadVoice());

        renderMeds();
        syncNative(loadMeds());
        renderStatus();
    </script>
    <script src="appts.js"></script>
    <script src="meds.js"></script>
    <script src="themes.js"></script>
    <script src="worlds.js"></script>
    <script src="scene3d.js"></script>
</body>
</html>
