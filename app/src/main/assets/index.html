<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MedTime</title>
    <!-- M-013: Three.js bundled in the app (works offline) -->
    <script src="lib/three.min.js"></script>
    <script src="lib/CopyShader.js"></script>
    <script src="lib/LuminosityHighPassShader.js"></script>
    <script src="lib/EffectComposer.js"></script>
    <script src="lib/RenderPass.js"></script>
    <script src="lib/ShaderPass.js"></script>
    <script src="lib/UnrealBloomPass.js"></script>
    <script src="lib/RoomEnvironment.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            /* M-012: use the whole screen, small edge margin + safe areas (notch / round corners) */
            padding: max(26px, calc(8px + env(safe-area-inset-top))) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            align-items: stretch;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: none;
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.6rem;
            color: #38bdf8;
        }

        #canvas-container {
            width: 100%;
            max-width: none;
            height: 18vh;
            min-height: 110px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            max-width: none;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-add:active {
            background: var(--primary-hover);
        }

        .med-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: none;
        }

        .med-item {
            background: var(--card);
            padding: 14px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid var(--primary);
        }

        .med-info h3 {
            font-size: 1.05rem;
            margin-bottom: 2px;
        }

        .med-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* M-005: reminder status + test button */
        .status-box {
            width: 100%;
            max-width: none;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-line {
            background: #422006;
            border: 1px solid #f59e0b;
            color: #fde68a;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .status-line.ok {
            background: #052e1c;
            border-color: var(--accent);
            color: #a7f3d0;
        }

        .status-line button, button.btn-test {
            background: transparent;
            border: 1px solid currentColor;
            color: inherit;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        button.btn-test {
            color: #38bdf8;
            padding: 10px;
            font-size: 0.95rem;
        }

        /* M-006 / M-010: one card per medicine, large and readable */
        .item-row {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: #38bdf8;
        }

        .field-label {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .item-row input {
            font-size: 1.15rem;
            padding: 14px 12px;
        }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .type-btn {
            background: #1e293b;
            border: 2px solid #334155;
            color: var(--text);
            border-radius: 10px;
            padding: 8px 4px;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .type-btn .ico {
            font-size: 1.6rem;
        }

        .type-btn.sel {
            border-color: #38bdf8;
            background: #0c4a6e;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        /* M-010: time button + scroll wheel picker */
        .time-btn {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            border-radius: 10px;
            padding: 14px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            direction: ltr;
        }

        .sheet-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 50;
        }

        .sheet-bg.open {
            display: flex;
        }

        .sheet {
            background: var(--card);
            width: 100%;
            max-width: none;
            border-radius: 18px 18px 0 0;
            padding: 16px 16px 24px;
        }

        .sheet h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .wheels {
            direction: ltr;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .wheel-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .wheel-col small {
            color: var(--text-muted);
        }

        .wheel {
            height: 220px;
            width: 96px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            position: relative;
            -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
            mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
        }

        .wheel::-webkit-scrollbar {
            display: none;
        }

        .wheel div {
            height: 44px;
            line-height: 44px;
            text-align: center;
            font-size: 1.5rem;
            color: var(--text-muted);
            scroll-snap-align: center;
        }

        .wheel div.on {
            color: #f8fafc;
            font-size: 2rem;
            font-weight: 700;
        }

        .wheel-sep {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 20px;
        }

        .wheel-band {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(50% + 10px);
            height: 46px;
            transform: translateY(-50%);
            border-top: 2px solid #38bdf8;
            border-bottom: 2px solid #38bdf8;
            pointer-events: none;
            border-radius: 6px;
        }

        .sheet-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .sheet-actions button {
            padding: 14px;
            border-radius: 10px;
            font-size: 1.05rem;
            border: none;
        }

        select {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .item-row .btn-remove-item {
            background: transparent;
            border: 1px solid #475569;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 1rem;
        }

        button.btn-add-item {
            background: transparent;
            border: 1px dashed #38bdf8;
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .med-info ul {
            list-style: none;
            margin-top: 4px;
        }

        .med-info li {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* M-007: voice options */
        .voice-card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.95rem;
        }

        .switch-row input {
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
        }

        .switch-row.disabled {
            opacity: 0.4;
        }

        /* M-009: language picker */
        header {
            position: relative;
        }

        .lang-select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
        }

        /* M-011: gear button + settings screen */
        .gear-btn {
            position: absolute;
            top: 0;
            inset-inline-start: 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            padding: 2px 6px;
        }

        .gear-btn .badge {
            position: absolute;
            top: 2px;
            inset-inline-end: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f59e0b;
            display: none;
        }

        .gear-btn.warn .badge {
            display: block;
        }

        .settings-page {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 40;
            overflow-y: auto;
            padding: 16px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .settings-page.open {
            display: flex;
        }

        .settings-head {
            width: 100%;
            max-width: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .settings-head h2 {
            color: #38bdf8;
        }

        .settings-head button {
            background: #334155;
            color: var(--text);
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 1rem;
        }

        .settings-page .card h3 {
            font-size: 1.05rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .sound-group {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 10px 0 4px;
        }

        .sound-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }

        .sound-row label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sound-row input {
            width: 20px;
            height: 20px;
            accent-color: #38bdf8;
        }

        .sound-row button {
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            border-radius: 6px;
            padding: 4px 10px;
            white-space: nowrap;
        }

        .sound-list {
            max-height: 320px;
            overflow-y: auto;
        }

        .main-warn {
            width: 100%;
            max-width: none;
            margin-bottom: 16px;
        }

        /* M-011: low-vision display: bigger text, yellow on black */
        html.lowvision {
            font-size: 20px;
        }

        html.lowvision body,
        html.lowvision .settings-page {
            --bg: #000000;
            --card: #000000;
            --text: #ffffff;
            --text-muted: #ffe500;
            background: #000000;
        }

        html.lowvision .card,
        html.lowvision .med-item,
        html.lowvision .item-row {
            border: 2px solid #ffe500;
        }

        html.lowvision input,
        html.lowvision select,
        html.lowvision .time-btn {
            background: #000000;
            border: 2px solid #ffffff;
            color: #ffffff;
        }

        html.lowvision .med-info h3,
        html.lowvision .med-info li {
            color: #ffe500;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* ================= M-013: 3D look ================= */
        html {
            background: #070b1a;
        }

        body {
            background: transparent !important;
            perspective: 1200px;
        }

        #bg3d {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            display: block;
            transition: opacity 0.4s;
        }

        body > *:not(#bg3d):not(script) {
            position: relative;
            z-index: 1;
        }

        .settings-page, .sheet-bg {
            z-index: 40 !important;
            position: fixed !important;
        }

        .hero-space {
            height: 24vh;
            min-height: 140px;
            pointer-events: none;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ffffff 0%, #7dd3fc 45%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.55)) drop-shadow(0 4px 2px rgba(0, 0, 0, 0.6));
        }

        /* glass cards with depth, rim light and inner gloss */
        .card, .med-item {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.62), rgba(15, 23, 42, 0.48)) !important;
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 20px !important;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.18) inset,
                0 -12px 30px rgba(56, 189, 248, 0.06) inset,
                0 18px 40px rgba(0, 0, 0, 0.55),
                0 4px 12px rgba(0, 0, 0, 0.4);
            transform-style: preserve-3d;
            animation: rise3d 0.7s cubic-bezier(.2, .8, .2, 1) both;
        }

        .card::before, .med-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 38%);
            pointer-events: none;
        }

        .card, .med-item {
            position: relative;
        }

        .med-item {
            border-right: none !important;
            border-inline-start: 5px solid #38bdf8 !important;
            transition: transform 0.25s ease-out;
            will-change: transform;
        }

        .med-list .med-item:nth-child(2) { animation-delay: 0.08s; }
        .med-list .med-item:nth-child(3) { animation-delay: 0.16s; }
        .med-list .med-item:nth-child(4) { animation-delay: 0.24s; }
        .med-list .med-item:nth-child(n+5) { animation-delay: 0.3s; }

        @keyframes rise3d {
            from { opacity: 0; transform: translateY(40px) rotateX(18deg) scale(0.96); }
            to { opacity: 1; transform: none; }
        }

        .item-row {
            background: rgba(2, 6, 23, 0.55) !important;
            border: 1px solid rgba(56, 189, 248, 0.25) !important;
            border-radius: 16px !important;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45) inset, 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        input, select, .time-btn {
            background: rgba(15, 23, 42, 0.75) !important;
            border: 1px solid rgba(148, 163, 184, 0.35) !important;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5) inset;
        }

        input:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5) inset, 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        /* pneumatic 3D buttons: raised edge, glow, press down */
        button.btn-add {
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 55%, #1d4ed8 100%) !important;
            border-radius: 14px !important;
            padding: 16px !important;
            font-size: 1.15rem !important;
            box-shadow: 0 6px 0 #1e3a8a, 0 10px 24px rgba(37, 99, 235, 0.55), 0 1px 0 rgba(255, 255, 255, 0.4) inset;
            transform: translateY(0);
            transition: transform 0.08s, box-shadow 0.08s;
        }

        button.btn-add:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #1e3a8a, 0 4px 10px rgba(37, 99, 235, 0.5), 0 1px 0 rgba(255, 255, 255, 0.3) inset;
        }

        .type-btn {
            background: linear-gradient(180deg, rgba(51, 65, 85, 0.9), rgba(30, 41, 59, 0.9)) !important;
            box-shadow: 0 4px 0 rgba(2, 6, 23, 0.9), 0 6px 14px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.15) inset;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .type-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(2, 6, 23, 0.9), 0 2px 6px rgba(0, 0, 0, 0.45);
        }

        .type-btn.sel {
            background: linear-gradient(180deg, #0e7490, #0c4a6e) !important;
            box-shadow: 0 4px 0 #082f49, 0 0 18px rgba(56, 189, 248, 0.8), 0 1px 0 rgba(255, 255, 255, 0.3) inset !important;
        }

        .type-btn .ico {
            filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.6));
            transition: transform 0.3s;
        }

        .type-btn.sel .ico {
            transform: scale(1.18) rotate(-8deg);
        }

        .time-btn {
            font-size: 2.2rem !important;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9)) !important;
            color: #e0f2fe !important;
            text-shadow: 0 0 14px rgba(56, 189, 248, 0.8);
            box-shadow: 0 5px 0 rgba(2, 6, 23, 0.9), 0 10px 22px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.12) inset !important;
        }

        button.btn-add-item {
            background: rgba(56, 189, 248, 0.08) !important;
            border-radius: 14px !important;
        }

        .gear-btn {
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
            transition: transform 0.6s;
        }

        .gear-btn:active {
            transform: rotate(120deg);
        }

        .med-info h3 {
            font-size: 1.35rem !important;
            color: #e0f2fe;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .med-info li {
            font-size: 1.05rem !important;
        }

        .sheet {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.96)) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.6);
            animation: sheetUp 0.35s cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes sheetUp {
            from { transform: translateY(100%); }
            to { transform: none; }
        }

        .settings-page {
            background: rgba(7, 11, 26, 0.72) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* wide screens / landscape: form and list side by side */
        @media (min-width: 760px) {
            body {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                column-gap: 14px;
                align-content: start;
            }
            header, .hero-space, #main-warn {
                grid-column: 1 / -1;
            }
        }

        html.lowvision .card,
        html.lowvision .med-item {
            background: #000 !important;
            backdrop-filter: none;
        }

        /* ================= M-014: settings screen redesign ================= */
        .settings-page {
            padding: max(22px, env(safe-area-inset-top)) 12px 16px !important;
            align-items: stretch !important;
        }

        .settings-hero {
            position: relative;
            text-align: center;
            padding: 6px 0 14px;
        }

        .hero-gear {
            font-size: 4.2rem;
            line-height: 1;
            filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.8)) drop-shadow(0 8px 6px rgba(0, 0, 0, 0.6));
            animation: gearSpin 14s linear infinite;
            display: inline-block;
        }

        @keyframes gearSpin {
            to { transform: rotate(360deg); }
        }

        .settings-hero h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-top: 6px;
            background: linear-gradient(180deg, #ffffff, #7dd3fc 50%, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
        }

        .close-3d {
            position: absolute;
            top: 4px;
            inset-inline-end: 0;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            color: #fff;
            background: radial-gradient(circle at 35% 30%, #64748b, #1e293b 70%);
            box-shadow: 0 5px 0 #020617, 0 10px 20px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.3) inset;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .close-3d:active {
            transform: translateY(4px);

        /* ================= M-017: frameless floating controls, centred text ================= */

    <script>
        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.error(e);
            }
        }

        const form = document.getElementById('med-form');
        const list = document.getElementById('med-list');

        // M-005: native Android bridge (exists only inside the app, not in a browser)
        const Native = window.MedTimeNative || null;

        function loadMeds() {
            const data = localStorage.getItem('medtime_list');
            let meds = [];
            try { meds = data ? JSON.parse(data) : []; } catch (e) { meds = []; }
            // Older entries: give them an id, and turn a single name/dose into an items list
            let changed = false;
            meds.forEach((m, i) => {
                if (!m.id) { m.id = newId() + i; changed = true; }
                if (!Array.isArray(m.items)) {
                    m.items = [{ name: m.name || '', dose: m.dose || '', type: 'pill' }];
                    delete m.name; delete m.dose;
                    changed = true;
                }
            });
            if (changed) localStorage.setItem('medtime_list', JSON.stringify(meds));
            return meds;
        }

        function newId() {
            // 1..99,999,999 (fits the Android alarm request code)
            return (Date.now() % 99000000) + 1;
        }

        function syncNative(meds) {
            if (!Native) return;
            try {
                Native.syncReminders(JSON.stringify(meds.map(m => ({
                    id: m.id, time: m.time, items: m.items
                }))));
            } catch (e) { console.error(e); }
        }

        function saveMeds(meds) {
            localStorage.setItem('medtime_list', JSON.stringify(meds));
            syncNative(meds);
            renderMeds();
        }

        function renderStatus() {
            const box = document.getElementById('status-box');
            if (!Native) { box.innerHTML = ''; return; }
            let st = {};
            try { st = JSON.parse(Native.getStatus()); } catch (e) { }
            let html = '';
            ['notifications', 'exact', 'fullScreen', 'battery'].forEach(k => {
                if (st[k] === false) {
                    html += `<div class="status-line"><span>⚠️ ${t('st_' + k)}</span>` +
                        `<button onclick="MedTimeNative.openSettings('${k}')">${t('fix')}</button></div>`;
                }
            });
            if (st.tts === 'no_voice' || st.tts === 'no_hebrew') {
                html += `<div class="status-line"><span>⚠️ ${t('noVoice')}</span>` +
                    `<button onclick="MedTimeNative.openSettings('tts')">${t('voiceSettings')}</button></div>`;
            }
            const problem = !!html;
            lastStatusProblem = problem;
            // Main screen: only a short line when something needs fixing; details live in settings
            document.getElementById('main-warn').innerHTML = problem
                ? `<div class="status-line"><span>${t('problemMain')}</span><button onclick="openSettingsPage()">${t('openSettings')}</button></div>`
                : '';

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function deleteMed(index) {

        function updateListBtn() {

            const btn = document.getElementById('list-btn');

            btn.style.display = '';
            const now = new Date(), cur = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            const next = (meds.find(m => m.time > cur) || meds[0]).time;
            btn.innerHTML = `<span class="lb-count">${meds.length}</span><span class="lb-title"></span><span class="lb-next">⏰ <span class="lb-nt"></span> ${next}</span>`;
            btn.querySelector('.lb-title').textContent = t('myReminders');
            btn.querySelector('.lb-nt').textContent = t('nextAt');
        }
        function openListPage() { document.getElementById('list-page').classList.add('open'); }
        function closeListPage() { document.getElementById('list-page').classList.remove('open'); }

        function renderMeds() {
            updateListBtn();
            const meds = loadMeds();
            if (!meds.length) closeListPage();
            list.innerHTML = '';
            meds.forEach((m, idx) => {
                const li = document.createElement('li');
                li.className = 'med-item';
                li.innerHTML = `
                    <div class="med-info">
                        <h3>⏰ ${m.time}</h3>
                        <ul>${m.items.map(it => `<li>${TYPE_ICON[it.type] || '💊'} ${escapeHtml(it.name)}` +

        const TYPES = ['pill', 'injection', 'drops', 'syrup', 'cream', 'inhaler'];

        // M-010: one big readable card per medicine: type buttons with icons, labelled fields

                    `<span class="ico">${TYPE_ICON[ty]}</span><span data-i18n="type_${ty}">${t('type_' + ty)}</span></button>`).join('')}</div>` +

        // M-022: "another medicine" keeps the previous one as a small chip and clears the fields
        function collapseRow(row) {

        // ---------- M-016: medicine name autocomplete after 2 letters ----------
        const normName = s => (s || '').toLowerCase().replace(/[\u0591-\u05C7'"׳״\-]/g, '').replace(/\s+/g, ' ').trim();
        function medSuggestions(q) {
            const nq = normName(q);
            if (nq.length < 2) return [];
            const own = [];
            try {
                JSON.parse(localStorage.getItem('medtime_list') || '[]').forEach(r =>
                    (r.items || [{ name: r.name, type: 'pill' }]).forEach(it => { if (it && it.name) own.push({ h: it.name, e: '', t: it.type || 'pill', d: it.dose || '', own: true }); }));
            } catch (e) { }
            const all = own.concat(window.MED_DB || []);
            const starts = [], inside = [], seen = new Set();
            all.forEach(m => {
                const key = normName(m.h);
                if (seen.has(key)) return;
                const fields = [normName(m.h), normName(m.e)];
                const words = fields.join(' ').split(/[\s()\/+]+/);
                if (fields.some(f => f.startsWith(nq)) || words.some(w => w.startsWith(nq))) { starts.push(m); seen.add(key); }
                else if (fields.some(f => f.includes(nq))) { inside.push(m); seen.add(key); }

        function attachUnits(row) {

                        // typical dose is only a suggestion: filled when empty, the user can change it
                        if (dose && !dose.value && dz) dose.value = dz;
                        if (dose) dose.focus();
                    });
                    box.appendChild(b);
                });
                // M-024: open above the field (the keyboard covers the area below), best match nearest the field
                box.style.maxHeight = Math.max(120, inp.getBoundingClientRect().top - 64) + 'px';
                box.classList.add('open');
            };
            inp.addEventListener('input', show);
            inp.addEventListener('focus', show);
            inp.addEventListener('blur', () => setTimeout(close, 150));
        }

        function numberRows() {
            [...itemRows.children].forEach((r, i) => { r.querySelector('.it-num').textContent = i + 1; });
            itemRows.classList.toggle('multi', itemRows.children.length > 1); // M-021: "item N" only with several
        }

        // ---------- M-010: scroll wheel time picker ----------
        const WHEEL_ITEM = 44;

        function buildWheel(el, count) {
            let html = '<div></div><div></div>';
            for (let i = 0; i < count; i++) html += `<div>${String(i).padStart(2, '0')}</div>`;
            html += '<div></div><div></div>';
            el.innerHTML = html;
            let last = -1, timer = null;
            el.addEventListener('scroll', () => {
                const idx = wheelIndex(el, count);
                if (idx !== last) {
                    last = idx;
                    el.querySelectorAll('div').forEach((d, i) => d.classList.toggle('on', i === idx + 2));
                    if (navigator.vibrate) navigator.vibrate(5);
                }
            });
        }

        function wheelIndex(el, count) {
            return Math.max(0, Math.min(count - 1, Math.round(el.scrollTop / WHEEL_ITEM)));
        }

        function setWheel(el, value) {
            el.scrollTop = value * WHEEL_ITEM;
            el.querySelectorAll('div').forEach((d, i) => d.classList.toggle('on', i === value + 2));
        }

        const wheelH = document.getElementById('wheel-h');
        const wheelM = document.getElementById('wheel-m');
        buildWheel(wheelH, 24);
        buildWheel(wheelM, 60);

        function openTimePicker() {
            const cur = document.getElementById('med-time').value;
            let h, m;
            if (cur) { [h, m] = cur.split(':').map(Number); }
            else { const d = new Date(); h = d.getHours(); m = d.getMinutes(); }
            document.getElementById('time-sheet').classList.add('open');
            setWheel(wheelH, h);
            setWheel(wheelM, m);
        }

        function closeTimePicker() {
            document.getElementById('time-sheet').classList.remove('open');
        }

        function confirmTimePicker() {
            const v = String(wheelIndex(wheelH, 24)).padStart(2, '0') + ':' + String(wheelIndex(wheelM, 60)).padStart(2, '0');
            document.getElementById('med-time').value = v;
            document.getElementById('time-btn').textContent = '⏰ ' + v;
            closeTimePicker();
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const timeInput = document.getElementById('med-time');
            const items = [...itemRows.querySelectorAll('.item-row')].map(r => ({
                type: r.dataset.type || 'pill',
                name: r.querySelector('.it-name').value.trim(),
                dose: r.querySelector('.it-dose').value.trim()
            })).filter(it => it.name);
            if (!items.length) { alert(t('needName')); return; }
            if (!timeInput.value) { openTimePicker(); return; }

            const meds = loadMeds();
            meds.push({ id: newId(), time: timeInput.value, items });
            meds.sort((a, b) => a.time.localeCompare(b.time));
            saveMeds(meds);
            playChime();
            if (window.MedTime3D) window.MedTime3D.pulse(); // M-013: hero capsule celebrates
            const lb = document.getElementById('list-btn'); lb.classList.remove('bump'); void lb.offsetWidth; lb.classList.add('bump');

            itemRows.innerHTML = '';
            addItemRow();
            timeInput.value = '';
            resetTimeBtn();
        });

        // M-021: label sits inside the time button until a time is chosen
        function resetTimeBtn() {
            document.getElementById('time-btn').innerHTML = `<span class="tb-empty">⏰ <span data-i18n="timeLabel">${t('timeLabel')}</span></span>`;
        }
        resetTimeBtn();

        applyLanguage();
        addItemRow();

        document.getElementById('lang-select').addEventListener('change', e => {
            LANG = e.target.value;
            try { localStorage.setItem('medtime_lang', LANG); } catch (err) { }
            applyLanguage();
            // Re-draw the list / status in the new language (typed text is kept)
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
            renderMeds();
            renderStatus();
            renderSounds();
        });

        // M-013: reminder cards tilt in 3D under the finger
        list.addEventListener('pointermove', e => {
            const card = e.target.closest('.med-item');
            if (!card) return;
            const r = card.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width - 0.5;
            const y = (e.clientY - r.top) / r.height - 0.5;
            card.style.transform = `rotateY(${x * 10}deg) rotateX(${-y * 10}deg) translateZ(10px)`;
        });
        ['pointerleave', 'pointerup', 'pointercancel'].forEach(ev => list.addEventListener(ev, () => {
            list.querySelectorAll('.med-item').forEach(c => { c.style.transform = ''; });
        }, true));

        // ---------- M-011: settings screen ----------
        function openSettingsPage() {
            document.getElementById('settings-page').classList.add('open');
            renderSounds();
            renderStatus();
            updateSettingsSummary();
        }

        // M-014: big tiles that open / close, with the current value under each title
        function toggleTile(head) {
            const tile = head.closest('.set-tile');
            const open = !tile.classList.contains('open');
            closeTiles();
            if (open) {
                tile.classList.add('open');
                document.getElementById('set-backdrop').classList.add('open');
            }
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function closeTiles() {
            document.querySelectorAll('.set-tile.open').forEach(x => x.classList.remove('open'));
            document.getElementById('set-backdrop').classList.remove('open');
            updateSettingsSummary();
        }

        // M-015: each panel gets a header (icon, title, close) when it rises from the bottom
        document.querySelectorAll('.set-tile').forEach(tile => {
            const body = tile.querySelector('.set-body');
            const head = document.createElement('div');
            head.className = 'panel-head';
            head.innerHTML = '<span class="grip"></span><span class="p-ico">' + tile.querySelector('.set-ico').textContent +
                '</span><span class="p-title" data-i18n-strip="' + tile.querySelector('.set-title').dataset.i18nStrip +
                '"></span><button type="button" class="p-close" aria-label="close">✕</button>';
            head.querySelector('.p-close').onclick = closeTiles;
            const pt = head.querySelector('.p-title');
            pt.textContent = t(pt.dataset.i18nStrip).replace(/^\S+\s/, '');
            head.querySelector('.p-ico').style.setProperty('--g', tile.style.getPropertyValue('--g'));
            body.insertBefore(head, body.firstChild);
        });

        var lastStatusProblem = false;
        function updateSettingsSummary() {
            const set = (k, v) => { const el = document.getElementById('sub-' + k); if (el) el.textContent = v; };
            const opt = document.querySelector('#lang-select option[value="' + LANG + '"]');
            set('langTitle', opt ? opt.textContent : LANG);
            const v = (typeof loadVoice === 'function') ? loadVoice() : { on: true, names: true, dose: true };
            set('voiceTitle', v.on ? [t('on'), v.names ? t('namesShort') : null, v.names && v.dose ? t('doseShort') : null].filter(Boolean).join(' · ') : t('off'));
            const chosen = document.querySelector('#sound-list input[name=snd]:checked');
            set('soundTitle', chosen ? chosen.parentElement.textContent.trim() : t('tapToChange'));
            set('lowVisionTitle', document.getElementById('low-vision').checked ? t('on') : t('off'));
            set('statusTitle', lastStatusProblem ? t('statusProblem') : t('statusOk'));
        }

        document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => {
            const sel = document.getElementById('lang-select');
            sel.value = b.dataset.lang;
            sel.dispatchEvent(new Event('change'));
        }));

        function closeSettingsPage() {
            closeTiles();
            document.getElementById('settings-page').classList.remove('open');
            if (Native && Native.stopPreview) { try { Native.stopPreview(); } catch (e) { } }
        }

        function renderSounds() {
            const box = document.getElementById('sound-list');
            let list = [], chosen = '';
            if (Native && Native.getSounds) {
                try { list = JSON.parse(Native.getSounds()); chosen = Native.getChosenSound() || ''; } catch (e) { }
            }
            const row = (uri, title) =>
                `<div class="sound-row"><label><input type="radio" name="snd" value="${escapeHtml(uri)}"${uri === chosen ? ' checked' : ''}>` +
                `<span>${escapeHtml(title)}</span></label>` +
                (uri === 'none' ? '' : `<button type="button" data-uri="${escapeHtml(uri)}">${t('preview')}</button>`) + `</div>`;
            let html = row('', t('soundDefault')) + row('none', t('soundNone'));
            let lastKind = '';
            list.forEach(sd => {
                if (sd.kind !== lastKind) {
                    lastKind = sd.kind;
                    html += `<div class="sound-group">${t(sd.kind === 'alarm' ? 'soundAlarm' : 'soundNotif')}</div>`;
                }
                html += row(sd.uri, sd.title);
            });
            box.innerHTML = html;
            box.querySelectorAll('input[name=snd]').forEach(r => r.addEventListener('change', () => {
                updateSettingsSummary();
                if (Native && Native.setSound) Native.setSound(r.value);
                if (Native && Native.previewSound && r.value !== 'none') Native.previewSound(r.value);
            }));
            box.querySelectorAll('button[data-uri]').forEach(b => b.addEventListener('click', () => {
                if (Native && Native.previewSound) Native.previewSound(b.dataset.uri);
            }));
        }

        function applyLowVision(on) {
            document.documentElement.classList.toggle('lowvision', on);
            if (window.MedTime3D) window.MedTime3D.setDim(on);
            document.getElementById('low-vision').checked = on;
            if (Native && Native.setLowVision) { try { Native.setLowVision(on); } catch (e) { } }
        }

        document.getElementById('low-vision').addEventListener('change', e => {
            try { localStorage.setItem('medtime_lowvision', e.target.checked ? '1' : '0'); } catch (err) { }
            applyLowVision(e.target.checked);
            updateSettingsSummary();
        });
        applyLowVision((() => { try { return localStorage.getItem('medtime_lowvision') === '1'; } catch (e) { return false; } })());

        // M-007: voice options, saved here and in Android
        function loadVoice() {
            try { return Object.assign({ on: true, names: true, dose: true }, JSON.parse(localStorage.getItem('medtime_voice') || '{}')); }
            catch (e) { return { on: true, names: true, dose: true }; }
        }

        function applyVoice(v) {
            document.getElementById('v-on').checked = v.on;
            document.getElementById('v-names').checked = v.names;
            document.getElementById('v-dose').checked = v.dose;
            document.getElementById('row-names').classList.toggle('disabled', !v.on);
            document.getElementById('row-dose').classList.toggle('disabled', !v.on || !v.names);
            if (Native && Native.setVoiceOptions) {
                try { Native.setVoiceOptions(v.on, v.names, v.dose); } catch (e) { }
            }
        }

        ['v-on', 'v-names', 'v-dose'].forEach(idName => {
            document.getElementById(idName).addEventListener('change', () => {
                const v = {
                    on: document.getElementById('v-on').checked,
                    names: document.getElementById('v-names').checked,
                    dose: document.getElementById('v-dose').checked
                };
                localStorage.setItem('medtime_voice', JSON.stringify(v));
                applyVoice(v);
                updateSettingsSummary();
            });
        });
        applyVoice(loadVoice());

        renderMeds();
        syncNative(loadMeds());
        renderStatus();
    </script>
    <script src="meds.js"></script>
    <script src="scene3d.js"></script>
</body>
</html>
