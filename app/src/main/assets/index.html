<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedTime</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 480px;
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.6rem;
            color: #38bdf8;
        }

        #canvas-container {
            width: 100%;
            max-width: 480px;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            background: #334155;
            border: 1px solid #475569;
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-add:active {
            background: var(--primary-hover);
        }

        .med-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 480px;
        }

        .med-item {
            background: var(--card);
            padding: 14px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid var(--primary);
        }

        .med-info h3 {
            font-size: 1.05rem;
            margin-bottom: 2px;
        }

        .med-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn-delete {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>MedTime</h1>
    </header>

    <div id="canvas-container"></div>

    <div class="card">
        <form id="med-form" class="form-group">
            <input type="text" id="med-name" placeholder="שם התרופה" required>
            <input type="time" id="med-time" required>
            <button type="submit" class="btn-add">הוסף תזכורת</button>
        </form>
    </div>

    <ul id="med-list" class="med-list"></ul>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const pillGroup = new THREE.Group();
        const cylinderGeo = new THREE.CylinderGeometry(0.7, 0.7, 1.2, 32);
        const sphereGeo = new THREE.SphereGeometry(0.7, 32, 16);

        const matRed = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, metalness: 0.1 });
        const matWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3, metalness: 0.1 });

        const bodyMesh = new THREE.Mesh(cylinderGeo, matWhite);
        const capTop = new THREE.Mesh(sphereGeo, matRed);
        capTop.position.y = 0.6;
        const capBottom = new THREE.Mesh(sphereGeo, matWhite);
        capBottom.position.y = -0.6;

        pillGroup.add(bodyMesh, capTop, capBottom);
        pillGroup.rotation.z = Math.PI / 4;
        scene.add(pillGroup);

        camera.position.z = 4.5;

        function animate() {
            requestAnimationFrame(animate);
            pillGroup.rotation.y += 0.015;
            pillGroup.rotation.x += 0.008;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.error(e);
            }
        }

        const form = document.getElementById('med-form');
        const list = document.getElementById('med-list');

        function loadMeds() {
            const data = localStorage.getItem('medtime_list');
            return data ? JSON.parse(data) : [];
        }

        function saveMeds(meds) {
            localStorage.setItem('medtime_list', JSON.stringify(meds));
            renderMeds();
        }

        function deleteMed(index) {
            const meds = loadMeds();
            meds.splice(index, 1);
            saveMeds(meds);
        }

        function renderMeds() {
            const meds = loadMeds();
            list.innerHTML = '';
            meds.forEach((m, idx) => {
                const li = document.createElement('li');
                li.className = 'med-item';
                li.innerHTML = `
                    <div class="med-info">
                        <h3>${m.name}</h3>
                        <p>שעה: ${m.time}</p>
                    </div>
                    <button class="btn-delete" onclick="deleteMed(${idx})">מחק</button>
                `;
                list.appendChild(li);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('med-name');
            const timeInput = document.getElementById('med-time');

            const newMed = {
                name: nameInput.value.trim(),
                time: timeInput.value
            };

            const meds = loadMeds();
            meds.push(newMed);
            saveMeds(meds);
            playChime();

            nameInput.value = '';
            timeInput.value = '';
        });

        renderMeds();
    </script>
</body>
</html>
