plugins {
    id 'com.android.application'
}

android {
    namespace 'com.medtime.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.medtime.app"
        minSdk 24
        targetSdk 34
        // Build number from GitHub Actions, so every build has a higher version
        versionCode 100 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Fixed signing key: every new APK installs over the previous one on the phone
    signingConfigs {
        debug {
            storeFile file('medtime-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
