plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.medtime.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.medtime.app"
        minSdk 24
        targetSdk 36 // Google Play: new apps must target API 36 (from 2026-08-31)
        // Build number from GitHub Actions, so every build has a higher version
        // MT_VERSION_RUN: the MyTime store workflow sets its own number (its run counter restarted when the workflow file was renamed)
        versionCode 100 + (System.getenv('MT_VERSION_RUN') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionName "1.0." + (System.getenv('MT_VERSION_RUN') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Fixed signing key: every new APK installs over the previous one on the phone
    signingConfigs {
        debug {
            storeFile file('medtime-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Google Play: two editions from the same code. "full" = the owner's test phone and GitHub (self-update, automatic SMS);
    // "play" = the store edition (no self-update, no automatic SMS, no USE_EXACT_ALARM), signed with the upload key
    flavorDimensions 'store'
    productFlavors {
        // STORE = MyTime look (no medicine wording). GPLAY = Google Play rules (no self-update, no web updates, no automatic SMS).
        full { dimension 'store'; buildConfigField 'boolean', 'STORE', 'false'; buildConfigField 'boolean', 'GPLAY', 'false'; manifestPlaceholders = [appLabel: 'MedTime'] }
        // M-375: the full MedTime for Google Play internal testing only (separate app, testers by e-mail)
        playfull { dimension 'store'; buildConfigField 'boolean', 'STORE', 'false'; buildConfigField 'boolean', 'GPLAY', 'true'; applicationId 'io.github.mailronicell.medtime.full'; manifestPlaceholders = [appLabel: 'MedTime'] }
        play { dimension 'store'; buildConfigField 'boolean', 'STORE', 'true'; buildConfigField 'boolean', 'GPLAY', 'true'; applicationId 'io.github.mailronicell.medtime'; manifestPlaceholders = [appLabel: 'MyTime'] } // com.medtime.app is taken on Google Play
    }
    buildFeatures { buildConfig true }
    if (System.getenv('UPLOAD_KEYSTORE')) {
        signingConfigs {
            upload {
                storeFile file(System.getenv('UPLOAD_KEYSTORE'))
                storePassword System.getenv('UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // M-368 (app diet): remove unused code from the libraries (smaller APK). Rules: proguard-rules.pro
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            if (System.getenv('UPLOAD_KEYSTORE')) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // M-087: native voice engine libraries stay compressed inside the APK (smaller download)
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
